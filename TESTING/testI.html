<!DOCTYPE html>
<!-- THE NANDO NOTES -->
<!-- <!DOCTYPE html> tells the browser "this is modern HTML5". It must be the very first line,
     otherwise the browser falls back to old "quirks mode" and layouts can act strange. -->

<!-- <html> wraps the whole page. lang="en" tells browsers and screen readers the page is in English. -->
<html lang="en">

<!-- <head> holds info ABOUT the page (settings, title, linked files). Nothing in here shows up on the page itself. -->
<head>
    <!-- charset="UTF-8" lets the page display any character correctly (accents, symbols, emojis) -->
    <meta charset="UTF-8">

    <!-- Makes the page scale properly on phones instead of showing a tiny zoomed-out desktop view -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The text shown on the browser tab -->
    <title>CSV Reader Test</title>

    <!-- Links the stylesheet. Styling lives in styleI.css -->
    <link rel="stylesheet" href="styleI.css">
</head>

<!-- <body> holds everything the user actually sees on the page -->
<body>

    <!-- Implementation I: CSV Reader -->
    <h1>CSV Reader</h1>

    <!-- Creates a file upload button for CSVs only.
         - type="file"       -> makes it a "Choose File" button instead of a text box
         - id="csvFileInput" -> the name tag JavaScript and CSS use to find this exact button
         - accept=".csv"     -> the file picker only shows .csv files (convenience filter, not a security check) -->
    <input type="file" id="csvFileInput" accept=".csv">

    <!-- Search bar. type="search" gives a text box with a little "x" to clear it in most browsers.
         It starts "disabled" (grayed out) until a file is loaded, since there's nothing to search yet. -->
    <input type="search" id="searchInput" placeholder="Search text, numbers, or characters..." disabled>

    <!-- Status line: shows things like "Showing 15 of 240 lines" or "12 lines match" -->
    <p id="status">Pick a CSV file to get started.</p>

    <!-- This is where the CSV lines get displayed, one row per line.
         It starts empty; scriptI.js fills it in once a file is picked. -->
    <div id="output"></div>

    <!-- Buttons for expanding / collapsing the list. They start hidden until there's something to show. -->
    <div id="controls" hidden>
        <button id="showMoreBtn">Show 15 more</button>
        <button id="showAllBtn">Show all</button>
        <button id="collapseBtn">Collapse to 15</button>
    </div>

    <!-- Floating button in the bottom-right corner that scrolls back to the top of the page -->
    <button id="topBtn" title="Back to top" hidden>&#8593; Top</button>

    <!-- The CSV display / reader logic lives in scriptI.js, using JavaScript's FileReader API.
         Loaded at the end of <body> so the elements above exist before the script runs. -->
    <script src="scriptI.js"></script>

</body>
</html>

<!DOCTYPE html>
<!-- THE NANDO NOTES -->
<!-- <!DOCTYPE html> tells the browser "this is modern HTML5". It must be the very first line,
     otherwise the browser falls back to old "quirks mode" and layouts can act strange. -->

<!-- <html> wraps the whole page. lang="en" tells browsers and screen readers the page is in English. -->
<html lang="en">

<!-- <head> holds info ABOUT the page (settings, title, linked files). Nothing in here shows up on the page itself. -->
<head>
    <!-- charset="UTF-8" lets the page display any character correctly (accents, symbols, emojis) -->
    <meta charset="UTF-8">

    <!-- Makes the page scale properly on phones instead of showing a tiny zoomed-out desktop view -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The text shown on the browser tab -->
    <title>CSV Reader Test</title>

    <!-- Links the stylesheet. Styling lives in styleI.css (button centering + output box look) -->
    <link rel="stylesheet" href="styleI.css">
</head>

<!-- <body> holds everything the user actually sees on the page -->
<body>

    <!-- Implementation I: CSV Reader -->

    <!-- Creates a file upload button for CSVs only. The ID gives this specific button a unique name tag.
         - type="file"    -> makes it a "Choose File" button instead of a text box
         - id="csvFileInput" -> the name tag JavaScript and CSS use to find this exact button
         - accept=".csv"  -> the file picker only shows .csv files (the user can still override this,
                             so it's a convenience filter, not a security check) -->
    <input type="file" id="csvFileInput" accept=".csv">

    <!-- This is the output box where the CSV's content will be displayed.
         <pre> stands for "preformatted": it keeps the file's line breaks and spacing exactly as they are.
         It starts empty; scriptI.js fills it in once a file is picked. -->
    <pre id="output"></pre>

    <!-- The CSV display / reader logic lives in scriptI.js, using JavaScript's FileReader API.
         Loaded at the end of <body> so the button and output box exist before the script runs.
         (If it were in <head>, the script would look for elements that haven't been created yet.) -->
    <script src="scriptI.js"></script>

</body>
</html>

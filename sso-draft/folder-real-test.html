<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filekey: real folder tests</title>
    <style>
        body { font: 14px/1.5 system-ui, sans-serif; margin: 20px; }
        .ok { color: #1d7a3a; } .fail { color: #b3261e; font-weight: 600; }
        iframe { width: 900px; height: 700px; border: 1px solid #ccc; }
    </style>
</head>
<body>
<!--
    Headless:   node sso-draft/run-browser-test.mjs folder-real-test.html

    The folder feature with the BROWSER'S REAL FOLDER HANDLES  (FileSystemDirectoryHandle),  not the in-memory fake.
    The folder comes from  navigator.storage.getDirectory()  (the browser's private folder):  the same kind of handle
    showDirectoryPicker gives you for a OneDrive folder,  with the same calls.   Only the Windows "Select folder" window
    and its "Allow" prompt are skipped:  no automated test can click those.

    Covers:  file:// can use the API at all;  real read / write / not-found / listing / size;  the browser REMEMBERING
    a real handle across a reload  (IndexedDB);  both pages end to end on a real folder;  and the real picker refusing
    to open without a click.
-->
<h1>Filekey: real folder tests</h1>
<p id="summary">Running…</p>
<ol id="list"></ol>
<iframe id="frame" title="the page under test"></iframe>

<script src="../DIRECTORY/vaultcoreI.js"></script>
<script src="signincoreS.js"></script>
<script src="mailboxS.js"></script>
<script src="it-signerS.js"></script>
<script>
'use strict';

window.__results = [];
window.__done = false;

function check(name, ok, detail) {
    const good = ok === true;
    window.__results.push({ name: name, ok: good, detail: good ? '' : String(detail === undefined ? ok : detail) });
    const li = document.createElement('li');
    li.className = good ? 'ok' : 'fail';
    li.textContent = (good ? 'ok   ' : 'FAIL ') + name + (good ? '' : '   (' + (detail === undefined ? ok : detail) + ')');
    document.getElementById('list').appendChild(li);
}
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
async function until(fn, ms) {
    const end = Date.now() + (ms || 20000);
    while (Date.now() < end) { try { if (fn()) return true; } catch (e) { /* not yet */ } await wait(50); }
    return false;
}
async function code(fn, want) {
    try { await fn(); return 'no error'; } catch (e) { return e.code === want || e.name === want ? true : 'got ' + (e.code || e.name) + ': ' + e.message; }
}
const text = async function (p) { return (await fetch('../' + p)).text(); };
const bytes = async function (p) { return new Uint8Array(await (await fetch('../' + p)).arrayBuffer()); };

const frame = document.getElementById('frame');
function w() { return frame.contentWindow; }
function $(id) { return frame.contentDocument.getElementById(id); }
function load(page) { return new Promise(function (r) { frame.onload = function () { r(); }; frame.src = page + '?t=' + Date.now(); }); }
function type(id, v) { $(id).value = v; }
function click(id) { $(id).click(); }
function txt(id) { const e = $(id); return e ? e.textContent : ''; }
function pick(id, name, data) {
    const dt = new (w().DataTransfer)();
    dt.items.add(new (w().File)([data], name));
    $(id).files = dt.files;
    $(id).dispatchEvent(new (w().Event)('change'));
}
function picker(handle) { w().showDirectoryPicker = async function () { return handle; }; }
function noPicker() { w().showDirectoryPicker = async function () { throw new Error('the picker was opened, but the folder should have been remembered'); }; }
function deleteDb(name) { return new Promise(function (r) { const q = indexedDB.deleteDatabase(name); q.onsuccess = q.onerror = q.onblocked = function () { r(); }; }); }
async function readFile(dir, name) { return (await (await dir.getFileHandle(name)).getFile()).text(); }

async function run() {
    const ITPASS = 'flogic demo keyring only', PIN = '4829';

    // ---- 1.  can a file:// page use the folder API at all? ----
    check('file://: the page counts as secure (needed for folders)', window.isSecureContext === true);
    check('file://: this browser has the folder picker', typeof window.showDirectoryPicker === 'function');
    check('file://: Mailbox sees it', Mailbox.supported() === true);
    check('picker: the REAL picker refuses to open without a click', await code(function () { return window.showDirectoryPicker(); }, 'SecurityError'));

    // ---- 2.  a real folder ----
    const opfs = await navigator.storage.getDirectory();
    try { await opfs.removeEntry('FlogicDemo', { recursive: true }); } catch (e) { /* first run */ }
    const root = await opfs.getDirectoryHandle('FlogicDemo', { create: true });
    check('real folder: it is a real FileSystemDirectoryHandle', root instanceof FileSystemDirectoryHandle && root.kind === 'directory');
    check('real folder: the browser says we may use it', await root.queryPermission({ mode: 'readwrite' }) === 'granted');

    const signer = await SignInCore.openSigner(SignInCore.readSigner(await text('sso-draft/demo/demo-it.flogic-signer')), ITPASS);
    const ring = await SignInCore.keyringGroups(await text('demo-data/packs/demo-it.flogic-keyring'), ITPASS);
    const fern = ring.people[0], sd = ring.groups.filter(function (g) { return g.group === 'service-desk'; });

    const it = await Mailbox.openIT(root);
    const kf = await SignInCore.issueKey(signer, fern, sd, new Date(Date.now() + 7 * 86400000));
    await it.putKeyFor('u-0001', JSON.stringify(kf));
    const sub = await root.getDirectoryHandle('u-0001');
    check('IT: writes u-0001/flogic.flogic-key into a real folder', JSON.parse(await readFile(sub, 'flogic.flogic-key')).sig === kf.sig);
    check('IT: reads it back', JSON.parse(await it.getKeyFor('u-0001')).sig === kf.sig);
    check('IT: a person with no folder is null, not an error (real NotFoundError)', (await it.getKeyFor('u-0099')) === null);
    await (await root.getFileHandle('notes.txt', { create: true })).createWritable().then(async function (s) { await s.write('hi'); await s.close(); });
    await root.getDirectoryHandle('Fernando (old)', { create: true });
    const ids = await it.people();
    check('IT: lists real subfolders, ignores odd names and files', ids.length === 1 && ids[0] === 'u-0001', JSON.stringify(ids));
    const kf2 = await SignInCore.issueKey(signer, fern, sd, new Date(Date.now() + 14 * 86400000));
    await it.putKeyFor('u-0001', JSON.stringify(kf2));
    check('IT: writing again replaces the file (no "(1)" copies)', JSON.parse(await it.getKeyFor('u-0001')).sig === kf2.sig &&
          (await (async function () { const n = []; for await (const e of sub.keys()) n.push(e); return n; })()).join() === 'flogic.flogic-key');

    const mine = await Mailbox.openPersonal(sub);
    const claims = await SignInCore.check(SignInCore.readKey(await mine.getKey()), FLOGIC_IT_SIGNER);
    check('person: reads their key file from a real folder, and it checks', claims.sub === 'u-0001');
    const empty = await opfs.getDirectoryHandle('FlogicEmpty', { create: true });
    check('person: an empty real folder means "nothing yet"', (await (await Mailbox.openPersonal(empty)).getKey()) === null);
    const big = await root.getDirectoryHandle('u-0002', { create: true });
    const bw = await (await big.getFileHandle('flogic.flogic-key', { create: true })).createWritable();
    await bw.write('x'.repeat(300 * 1024)); await bw.close();
    check('person: a huge real file isn\'t read', await code(function () { return Mailbox.openPersonal(big).then(function (b) { return b.getKey(); }); }, 'not-a-file'));
    await root.removeEntry('u-0002', { recursive: true });

    // ---- 3.  the browser remembers a REAL handle ----
    await deleteDb('flogic-mailbox');
    await Mailbox.remember(root, 'it');
    const back = await Mailbox.recall('it');
    check('remember: a real folder is kept by the browser and comes back', !!back && await back.isSameEntry(root));
    check('remember: what comes back still works', await Mailbox.allowed(back, 'readwrite', false) === true &&
          JSON.parse(await (await Mailbox.openIT(back)).getKeyFor('u-0001')).sig === kf2.sig);
    await deleteDb('flogic-mailbox');
    await deleteDb('flogic-filekey');
    await root.removeEntry('u-0001', { recursive: true });

    // ---- 4.  IT's page on a real folder,  and remembering it after a reload ----
    const ringText = await text('demo-data/packs/demo-it.flogic-keyring');
    const signerText = await text('sso-draft/demo/demo-it.flogic-signer');
    async function openIT() {
        pick('ring-file', 'demo-it.flogic-keyring', ringText); pick('signer-file', 'demo-it.flogic-signer', signerText);
        type('it-pass', ITPASS); click('open');
        return until(function () { return !$('open-part').hidden; }, 30000);
    }
    await load('it-issue.html');
    picker(root);
    check('IT page: opens', await openIT());
    click('connect-folder');
    check('IT page: connects the real folder', await until(function () { return /Connected: "FlogicDemo"/.test(txt('folder-status')); }), txt('folder-status'));
    click('make-u-0001');
    check('IT page: Make key file writes into the real folder', await until(function () { return /Put Fernando G/.test(txt('issue-msg')); }, 30000), txt('issue-msg'));
    check('IT page: the row shows "good until"', await until(function () { return /good until/.test(txt('status-u-0001')); }), txt('status-u-0001'));
    const fresh = await readFile(await root.getDirectoryHandle('u-0001'), 'flogic.flogic-key');
    check('IT page: the file in the real folder checks', !!(await SignInCore.check(SignInCore.readKey(fresh), FLOGIC_IT_SIGNER)));

    await load('it-issue.html');
    noPicker();
    check('IT page, reloaded: opens', await openIT());
    check('IT page, reloaded: the folder is remembered, no picking again', await until(function () { return /Connected: "FlogicDemo"/.test(txt('folder-status')); }), txt('folder-status'));
    click('renew-all');
    check('IT page, reloaded: Renew everyone writes to the real folder', await until(function () { return /Renewed 2 people/.test(txt('issue-msg')); }, 30000), txt('issue-msg'));
    check('IT page: Renew everyone made DJ\'s subfolder too', !!(await root.getDirectoryHandle('u-0002')));

    // ---- 5.  the person's page on their real subfolder ----
    const fernFolder = await root.getDirectoryHandle('u-0001');
    await load('signin.html');
    picker(fernFolder);
    await until(function () { return $('connect'); });
    click('connect');
    check('person page: connects their real folder and asks for a PIN', await until(function () { return $('pin1') && /Hi, Fernando G/.test(txt('title')); }, 30000), txt('title') + ' / ' + txt('why'));
    type('pin1', PIN); type('pin2', PIN); click('set-pin');
    check('person page: signed in with a 4-digit PIN', await until(function () { return w().SignInPage.signedIn(); }, 30000), txt('why'));
    pick('pack-file', 'demo_incident.flogic', await bytes('demo-data/packs/demo_incident.flogic'));
    check('person page: their pack opens', await until(function () { return /Opened demo_incident/.test(txt('pack-result')); }, 30000), txt('pack-result'));
    click('lock');
    await until(function () { return $('pin'); });

    //  IT renews on the real folder;  the person's page should take it in by itself
    await wait(20);
    const renewed = await SignInCore.issueKey(signer, fern, sd, new Date(Date.now() + 21 * 86400000));
    await (await Mailbox.openIT(root)).putKeyFor('u-0001', JSON.stringify(renewed));
    type('pin', PIN); click('go');
    check('person page: takes in the renewal from the real folder by itself', await until(function () { return w().SignInPage.signedIn() && $('renewed'); }, 30000), txt('why'));
    click('lock');
    await until(function () { return $('pin'); });

    //  Forget, reload:  the folder is remembered,  so "Connect" doesn't open the picker again
    w().confirm = function () { return true; };                  //  "Forget Fernando G on this laptop?"  ->  yes
    click('forget');
    await until(function () { return $('connect'); });
    await load('signin.html');
    noPicker();
    await until(function () { return $('connect'); });
    click('connect');
    check('person page, reloaded: the folder is remembered, no picking again', await until(function () { return $('pin1'); }, 30000), txt('why'));

    //  the real "cancelled" path:  the person closes the picker
    await deleteDb('flogic-mailbox');
    await load('signin.html');
    w().showDirectoryPicker = async function () { throw new DOMException('The user aborted a request.', 'AbortError'); };
    await until(function () { return $('connect'); });
    click('connect');
    check('person page: closing the picker says so (not a ghost button)', await until(function () { return /No folder picked/.test(txt('why')); }), txt('why'));

    await opfs.removeEntry('FlogicDemo', { recursive: true });
    await opfs.removeEntry('FlogicEmpty', { recursive: true });
}

(async function () {
    try { await run(); } catch (e) { check('no unexpected error', false, e && (e.stack || e.message || e)); }
    const passed = window.__results.filter(function (r) { return r.ok; }).length;
    document.getElementById('summary').textContent = passed + ' / ' + window.__results.length + ' passed';
    window.__done = true;
})();
</script>
</body>
</html>

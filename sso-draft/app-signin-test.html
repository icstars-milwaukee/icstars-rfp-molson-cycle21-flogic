<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Key-file sign-in in the real app: tests</title>
    <style>
        body { font: 14px/1.5 system-ui, sans-serif; margin: 20px; }
        .ok { color: #1d7a3a; } .fail { color: #b3261e; font-weight: 600; }
        iframe { width: 1100px; height: 700px; border: 1px solid #ccc; }
    </style>
</head>
<body>
<!--
    Headless:   node sso-draft/run-browser-test.mjs app-signin-test.html

    Drives the REAL app  (DIRECTORY/testI.html)  in the frame:  sign in with a key file,  the PIN,  the access level,
    opening packs,  Lock,  renewal,  the end date,  the wipe.   Then it looks everywhere a page can keep things
    (localStorage,  sessionStorage,  cookies,  every IndexedDB database,  the page itself)  for a PIN or a plain key.

    The browser's folder picker is replaced by an IN-MEMORY folder  (memory-folderS.js),  so this does NOT prove a real
    OneDrive / Drive folder works.   Made-up data only.
-->
<h1>Key-file sign-in in the real app: tests</h1>
<p id="summary">Running…</p>
<ol id="list"></ol>
<iframe id="frame" title="the app under test"></iframe>

<script src="../DIRECTORY/vaultcoreI.js"></script>
<script src="../DIRECTORY/policyI.js"></script>
<script src="../DIRECTORY/signincoreI.js"></script>
<script src="../DIRECTORY/it-signerI.js"></script>
<script src="memory-folderS.js"></script>
<script>
'use strict';

window.__results = [];
window.__done = false;

function check(name, ok, detail) {
    const good = ok === true;
    window.__results.push({ name: name, ok: good, detail: good ? '' : String(detail === undefined ? ok : detail) });
    const li = document.createElement('li');
    li.className = good ? 'ok' : 'fail';
    li.textContent = (good ? 'ok   ' : 'FAIL ') + name + (good ? '' : '   (' + (detail === undefined ? ok : detail) + ')');
    document.getElementById('list').appendChild(li);
}
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
async function until(fn, ms) {
    const end = Date.now() + (ms || 20000);
    while (Date.now() < end) { try { if (fn()) return true; } catch (e) { /* not yet */ } await wait(50); }
    return false;
}
async function text(p) { return (await fetch('../' + p)).text(); }
async function bytes(p) { return new Uint8Array(await (await fetch('../' + p)).arrayBuffer()); }

const frame = document.getElementById('frame');
function w() { return frame.contentWindow; }
function d() { return frame.contentDocument; }
function $(id) { return d().getElementById(id); }
function load() {
    return new Promise(function (r) { frame.onload = function () { r(); }; frame.src = '../DIRECTORY/testI.html?t=' + Date.now(); });
}
function type(id, value) { $(id).value = value; }
function pick(id, name, data) {
    const dt = new (w().DataTransfer)();
    dt.items.add(new (w().File)([data], name));
    $(id).files = dt.files;
    $(id).dispatchEvent(new (w().Event)('change', { bubbles: true }));
}
function card() { return $('vaultCard'); }
function cardText() { return card() && !card().hidden ? card().textContent : ''; }
function title() { const t = $('vaultTitle'); return t ? t.textContent : ''; }
function why() { const p = card().querySelector('.vault-problem'); return p ? p.textContent : ''; }
function button(words) {
    return Array.from(card().querySelectorAll('button')).find(function (b) { return b.textContent.indexOf(words) === 0; });
}
function vault() { return w().FlogicVault; }
function unlocked() { return vault().state() === 'unlocked'; }
function rows() { return w().eval('rowCount'); }                 //  (the brain's own count:  a "let",  so not on window)
function deleteDb(name) {
    return new Promise(function (r) { const q = indexedDB.deleteDatabase(name); q.onsuccess = q.onerror = q.onblocked = function () { r(); }; });
}

//  EVERYTHING in every IndexedDB database of this origin,  as one piece of text  (handles show as  "[handle]").
async function everythingStored() {
    const out = {};
    for (const info of await indexedDB.databases()) {
        out[info.name] = await new Promise(function (r) {
            const q = indexedDB.open(info.name);
            q.onerror = function () { r('?'); };
            q.onsuccess = function () {
                const db = q.result, names = Array.from(db.objectStoreNames), got = {};
                if (names.length === 0) { db.close(); r(got); return; }
                const tx = db.transaction(names, 'readonly');
                names.forEach(function (n) { const g = tx.objectStore(n).getAll(); g.onsuccess = function () { got[n] = g.result; }; });
                tx.oncomplete = function () { db.close(); r(got); };
            };
        });
    }
    return { names: Object.keys(out), text: JSON.stringify(out, function (k, v) { return v && typeof v === 'object' && typeof v.getFile === 'function' ? '[handle]' : v; }) };
}

function today() { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }

async function run() {
    const S = SignInCore, PIN = '482916', ITPASS = 'flogic demo keyring only';
    const day = 86400000;

    const signer = await S.openSigner(S.readSigner(await text('sso-draft/demo/demo-it.flogic-signer')), ITPASS);
    const ring = await S.keyringGroups(await text('demo-data/packs/demo-it.flogic-keyring'), ITPASS);
    const sd = ring.groups.filter(function (g) { return g.group === 'service-desk'; });
    const fern = { id: 'u-0001', name: 'Fernando G', level: 'analyst', reviewed: today() };
    const visitor = { id: 'u-0009', name: 'Visitor V', level: 'guest', reviewed: today() };
    const incident = await bytes('demo-data/packs/demo_incident.flogic');
    const change = await bytes('demo-data/packs/demo_change_request.flogic');

    const keyFile = await S.issueKey(signer, fern, sd);
    const keyText = JSON.stringify(keyFile);
    const rawKey = keyFile.keys.entries[0].raw;                     //  the plain group key,  as it sits in the key file
    const mine = makeMemoryFolder('u-0001');
    mine.__files.set('flogic.flogic-key', keyText);

    for (const name of ['flogic-filekey', 'flogic-mailbox', 'flogic-vault']) await deleteDb(name);

    // ---- a new laptop ----
    await load();
    w().showDirectoryPicker = async function () { return mine; };
    check('app: the card is up before anything else, and offers the drive folder', await until(function () { return $('vaultConnect'); }) &&
          /Sign in to Flogic/.test(title()) && vault().state() === 'locked', title());
    check('app: the older credential way is still offered (the policy flag is on), but it isn\'t the main button',
          !!button('Set up with a credential file') && $('vaultConnect').className === 'vault-main');

    //  key files the app must refuse
    const edited = JSON.parse(keyText); const ec = JSON.parse(edited.claims);
    ec.level = 'analyst'; ec.groups[0].rules.autoLockMin = 29; edited.claims = JSON.stringify(ec);
    pick('vaultKeyFile', 'flogic.flogic-key', JSON.stringify(edited));
    check('refused: a key file edited after IT signed it', await until(function () { return /changed since IT made it/.test(why()); }), why());

    async function signedAnyway(change) {                           //  IT's REAL key signs something the rules forbid
        const c = JSON.parse(keyFile.claims); change(c);
        const t = JSON.stringify(c);
        const sig = await signer.sign(new TextEncoder().encode('FLGKEY4\n' + t));
        return JSON.stringify({ flogic: 'key', v: 4, claims: t, sig: VaultCore.toB64(new Uint8Array(sig)), keys: keyFile.keys });
    }
    pick('vaultKeyFile', 'flogic.flogic-key', await signedAnyway(function (c) { c.expires = new Date(Date.now() + 90 * day).toISOString(); }));
    check('refused: signed by IT, but lasting 90 days (the built-in 7-day rule)', await until(function () { return /lasts longer than/.test(why()); }), why());
    pick('vaultKeyFile', 'flogic.flogic-key', await signedAnyway(function (c) { c.level = 'viewer'; }));
    check('refused: signed by IT, but a Viewer who can export', await until(function () { return /can't export/.test(why()); }), why());
    pick('vaultKeyFile', 'flogic.flogic-key', await signedAnyway(function (c) { const t = new Date(Date.now() - 45 * day); c.reviewed = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }));
    check('refused: signed by IT, but made after the 30-day review ran out', await until(function () { return /review ran out/.test(why()); }), why());
    const other = await S.openSigner(await S.newSigner('some other IT passphrase', 1000), 'some other IT passphrase');
    pick('vaultKeyFile', 'flogic.flogic-key', JSON.stringify(await S.issueKey(other, fern, sd)));
    check('refused: a key file signed by some other IT key', await until(function () { return /wasn't made by this company's IT/.test(why()); }), why());
    pick('vaultKeyFile', 'notes.txt', 'hello');
    check('refused: a file that isn\'t a key file', await until(function () { return /isn't a Flogic key file/.test(why()); }), why());
    check('app: still locked after all of those', vault().state() === 'locked' && !card().hidden);

    // ---- the first time:  the folder,  then a PIN ----
    $('vaultConnect').click();
    check('first time: the folder\'s key file is found, and the card asks for a PIN', await until(function () { return $('vaultPin1') && /Hi, Fernando G/.test(title()); }, 30000), title() + ' / ' + why());
    check('first time: it says the level and the group IT gave', /Analyst/.test($('vaultGave').textContent) && /Service Desk/.test($('vaultGave').textContent), $('vaultGave').textContent);
    type('vaultPin1', '123'); type('vaultPin2', '123'); button('Sign in').click();
    check('PIN: a short one is refused', await until(function () { return /4 to 12 digits/.test(why()); }), why());
    type('vaultPin1', PIN); type('vaultPin2', PIN + '0'); button('Sign in').click();
    check('PIN: two that don\'t match are refused', await until(function () { return /don't match/.test(why()); }), why());
    type('vaultPin2', PIN); button('Sign in').click();
    check('first time: signed in, the card is gone', await until(unlocked, 30000) && card().hidden, why());
    check('signed in: the app knows who, which level, and until when', vault().person().name === 'Fernando G' && vault().person().level === 'analyst' &&
          vault().level().label === 'Analyst' && vault().accessEnds() > new Date() && vault().accessEnds() - Date.now() <= 7 * day + 60000);
    check('signed in: the Lock chip names the level', /Fernando G/.test($('vaultChip').textContent) && /Analyst/.test($('vaultChip').textContent), $('vaultChip').textContent);
    check('signed in: the auto-lock is the group\'s 15 minutes (an Analyst may have up to 30)', /15 min/.test($('vaultTimer').textContent), $('vaultTimer').textContent);

    // ---- packs ----
    pick('csvFileInput', 'demo_incident.flogic', incident);
    check('pack: Service Desk\'s pack opens in the real app', await until(function () { return vault().openPack() !== null && rows() === 2400; }, 60000),
          JSON.stringify(vault().openPack()) + ' rows ' + rows() + ' / ' + $('vaultNote').textContent);
    check('pack: an Analyst in an exporting group can export', vault().canExport() === true);
    check('pack: the stamp says who and which group', /Fernando G · Service Desk/.test(vault().stamp()), vault().stamp());
    const tilesAnalyst = await until(function () { return d().querySelectorAll('.dash-tile:not(.dash-waiting)').length > 3; }, 30000) ? d().querySelectorAll('.dash-tile').length : 0;
    check('level view: an Analyst gets the full dashboard (more than 3 tiles)', tilesAnalyst > 3, tilesAnalyst);
    pick('csvFileInput', 'demo_change_request.flogic', change);
    check('pack: Change Team\'s pack is refused, and says why', await until(function () { return /You're not in that group/.test($('vaultNote').textContent); }), $('vaultNote').textContent);

    // ---- NOTHING THAT SIGNS YOU IN IS READABLE ON THE LAPTOP ----
    let stored = await everythingStored();
    check('local: nothing in localStorage, sessionStorage or cookies', w().localStorage.length === 0 && w().sessionStorage.length === 0 && d().cookie === '',
          w().localStorage.length + ' / ' + w().sessionStorage.length + ' / ' + d().cookie);
    const dbs = JSON.parse(stored.text);
    check('local: the only databases are the key-file store, the folder memory, and the older way\'s store (empty)',
          stored.names.every(function (n) { return ['flogic-filekey', 'flogic-mailbox', 'flogic-vault'].indexOf(n) >= 0; }) &&
          (!dbs['flogic-vault'] || dbs['flogic-vault'].people.length === 0), stored.names.join());
    check('local: no PIN anywhere in the browser\'s databases', stored.text.indexOf(PIN) < 0);
    check('local: no plain group key anywhere in them', stored.text.indexOf(rawKey) < 0 && stored.text.indexOf('"raw"') < 0 && stored.text.indexOf('"entries"') < 0);
    check('local: no data from the open pack in them either', stored.text.indexOf('INC1000') < 0);
    const copy = JSON.parse(stored.text)['flogic-filekey'].people[0];
    check('local: the laptop copy is IT\'s signed claims plus LOCKED keys, and nothing else',
          Object.keys(copy).sort().join() === 'claims,id,locked,made,name,sig,tries' && Object.keys(copy.locked).sort().join() === 'data,iv,rounds,salt' &&
          copy.locked.rounds >= 600000, Object.keys(copy).sort().join());
    check('local: no PIN and no plain key on the page itself', d().documentElement.outerHTML.indexOf(PIN) < 0 && d().documentElement.outerHTML.indexOf(rawKey) < 0);
    const loose = Object.keys(w()).filter(function (k) { try { return typeof w()[k] === 'string' && (w()[k].indexOf(rawKey) >= 0 || w()[k] === PIN); } catch (e) { return false; } });
    check('local: no PIN and no plain key in any page-wide variable', loose.length === 0, loose.join());

    // ---- Lock ----
    $('vaultChip').click();
    check('Lock: the card is back, asking for the PIN only', await until(function () { return $('vaultPin') && !card().hidden; }) && vault().state() === 'locked' && /Fernando G/.test(title()));
    check('Lock: the open pack and its numbers are gone from the page', vault().openPack() === null && vault().person() === null &&
          d().querySelectorAll('.dash-tile').length === 0 && $('dash').hidden);
    check('Lock: the card says until when the key file is good', /Good until/.test($('vaultEnds').textContent), $('vaultEnds') && $('vaultEnds').textContent);

    // ---- every day:  the PIN ----
    type('vaultPin', '000001'); button('Sign in').click();
    check('daily: a wrong PIN is refused, and says how many tries are left', await until(function () { return /9 more tries/.test(why()); }, 30000), why());
    type('vaultPin', PIN); button('Sign in').click();
    check('daily: the PIN signs in', await until(unlocked, 30000), why());
    stored = await everythingStored();
    check('daily: the right PIN resets the wrong-PIN count', JSON.parse(stored.text)['flogic-filekey'].people[0].tries === 0);

    // ---- renewal from the folder,  and the end date ----
    //  (Before any reload:  the test's in-memory folder can't be remembered by the browser the way a real one is.
    //   A remembered REAL folder after a reload is covered by  folder-real-test.html.)
    $('vaultChip').click();
    await until(function () { return $('vaultPin') && /Fernando G/.test(title()); });
    await wait(20);
    mine.__files.set('flogic.flogic-key', JSON.stringify(await S.issueKey(signer, fern, sd, new Date(Date.now() + 9000))));       //  IT renews  (a 9-second one,  for the test)
    type('vaultPin', PIN); button('Sign in').click();
    check('renew: a newer key file in the folder is taken in by itself, same PIN', await until(function () { return unlocked() && /IT renewed your access/.test($('vaultNote').textContent); }, 30000),
          why() + ' / ' + $('vaultNote').textContent);
    check('end date: it signs you out by itself, and says why', await until(function () { return vault().state() === 'locked' && /Your access has ended/.test(cardText()); }, 25000), cardText());
    await until(function () { return $('vaultPin'); });
    type('vaultPin', PIN); button('Sign in').click();
    check('end date: the PIN doesn\'t get you back in with an ended key file', await until(function () { return /ended on/.test(why()); }, 30000) && vault().state() === 'locked', why());
    mine.__files.set('flogic.flogic-key', keyText);
    type('vaultPin', PIN); button('Sign in').click();
    await wait(1500);
    check('renew: an OLDER key file put back in the folder isn\'t taken', await until(function () { return /ended on/.test(why()); }, 30000) && vault().state() === 'locked', why());

    //  a page reload:  no folder click,  no key file,  just the PIN
    await load();
    w().showDirectoryPicker = async function () { throw new Error('the picker must not open'); };
    check('reload: straight to the PIN', await until(function () { return $('vaultPin'); }) && /Fernando G/.test(title()), title());

    // ---- a second person on this laptop:  a GUEST ----
    button('Someone else').click();
    await until(function () { return button('Someone new on this laptop'); });
    button('Someone new on this laptop').click();
    await until(function () { return $('vaultKeyFile'); });
    const guestKey = await S.issueKey(signer, visitor, sd);
    pick('vaultKeyFile', 'flogic.flogic-key', JSON.stringify(guestKey));
    check('guest: the card says Guest, and what a Guest gets', await until(function () { return $('vaultPin1') && /Hi, Visitor V/.test(title()); }, 30000) &&
          /Guest/.test($('vaultGave').textContent) && /export no/.test(cardText()) && /5 min/.test(cardText()), cardText());
    type('vaultPin1', '7391'); type('vaultPin2', '7391'); button('Sign in').click();
    await until(unlocked, 30000);
    check('guest: signed in for 1 day at most', unlocked() && vault().accessEnds() - Date.now() <= day + 60000 && vault().level().id === 'guest');
    check('guest: auto-lock is 5 minutes, not the group\'s 15', /5 min/.test($('vaultTimer').textContent) && !/15 min/.test($('vaultTimer').textContent), $('vaultTimer').textContent);
    pick('csvFileInput', 'demo_incident.flogic', incident);
    await until(function () { return vault().openPack() !== null && rows() === 2400; }, 60000);
    check('guest: the SAME pack opens, but a Guest can\'t export it (the group can, the level can\'t)', vault().openPack() !== null && vault().canExport() === false);
    const settled = await until(function () { const n = d().querySelectorAll('.dash-tile:not(.dash-waiting)').length; return n > 0; }, 30000);
    await wait(600);
    const tilesGuest = d().querySelectorAll('.dash-tile').length;
    check('level view: a Guest starts with a short summary (3 tiles), and the dashboard says so', settled && tilesGuest === 3 && tilesGuest < tilesAnalyst &&
          /Guest view/.test($('dash').textContent), tilesGuest + ' tiles');
    check('guest: Export report is off, with the reason', await until(function () { return /can't export/.test($('dash-why').textContent); }), $('dash-why').textContent);
    $('vaultChip').click();
    check('two people: after Lock the card asks who, with each one\'s level', await until(function () { return /Who's unlocking/.test(title()); }) &&
          /Analyst/.test(cardText()) && /Guest/.test(cardText()), cardText());

    button('Fernando G').click();
    await until(function () { return $('vaultPin') && /Fernando G/.test(title()); });

    // ---- 10 wrong PINs ----
    for (let i = 0; i < S.MAX_TRIES; i++) {
        type('vaultPin', '999990'); button('Sign in').click();
        const want = S.MAX_TRIES - i - 1;
        await until(function () { return want > 0 ? new RegExp(want + ' more tr').test(why()) : /forgot you/.test(cardText()); }, 30000);
    }
    stored = await everythingStored();
    const left = JSON.parse(stored.text)['flogic-filekey'].people.map(function (p) { return p.id; });
    check('wipe: 10 wrong PINs and this laptop forgets that person (only them)', /forgot you/.test(cardText()) && left.join() === 'u-0009', left.join() + ' / ' + cardText());
    check('wipe: the folder is forgotten too', !/\[handle\]/.test(stored.text));
}

(async function () {
    try { await run(); } catch (e) { check('no unexpected error', false, e && (e.stack || e.message || e)); }
    const passed = window.__results.filter(function (r) { return r.ok; }).length;
    document.getElementById('summary').textContent = passed + ' / ' + window.__results.length + ' passed';
    window.__done = true;
})();
</script>
</body>
</html>

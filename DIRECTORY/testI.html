<!DOCTYPE html>

<!--
    ==========================================================

        THE NANDO NOTES  -  testI.html

        This file is the SKELETON of the page.
        It says WHAT is on the page.

            testI.html   =  what's there     (skeleton)
            styleI.css   =  how it looks     (clothes)
            scriptI.js   =  what it does     (brain)

    ==========================================================


    The line at the very top  (<!DOCTYPE html>)  MUST stay first.
    It tells the browser:  "this is a normal, modern web page."
-->


<html lang="en">



<!--
    ----------------------------------------------------------

        THE HEAD

        Stuff the browser needs to know.
        You can't SEE any of this on the page.

    ----------------------------------------------------------
-->

<head>

    <!--  Lets the page show any letter or symbol  (é, ñ, ✓, 😀)  -->
    <meta charset="UTF-8">

    <!--  Makes the page fit on phones  -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--  The words on the browser tab  -->
    <title>CSV Reader Test</title>

    <!--  Put on the clothes  (styleI.css)  -->
    <link rel="stylesheet" href="styleI.css">

</head>



<!--
    ----------------------------------------------------------

        THE BODY

        Everything you can SEE on the page.
        It goes top to bottom, in this order.

        Each piece has a name tag:   id="..."
        The brain (scriptI.js) uses the name tag to find it.

    ----------------------------------------------------------
-->

<body>



    <!--
        0.  THE THEME HEXAGON   (top-left corner)

            Click it  ->  the theme menu floats down.
            It's filled with the color of the theme
            you're using right now, with a glowing outline.

            "aria-..."  =  notes for screen readers,
                           so they know it opens a menu.
    -->

    <button id="themeHex" title="Theme: Neo-Neutral" aria-haspopup="true" aria-expanded="false" aria-controls="themeMenu">
        <span class="hex">
            <span class="hex-inner"></span>
        </span>
    </button>


    <!--
        The floating theme menu.
        Glass, like the CSV window, but brighter and glowier,
        so you can tell them apart.

        The brain fills in the list of themes.
    -->

    <div id="themeMenu" role="menu" aria-label="Themes" hidden>
        <p class="menu-title">Theme</p>
        <div id="themeList"></div>
    </div>



    <!--  1.  The big title  -->

    <h1>CSV Reader</h1>



    <!--
        2.  The "Choose File" button

            type="file"          ->  makes it a "pick a file" button
            accept=".csv,.xlsx"  ->  only shows CSV and Excel files when you pick

        The badge under it says "XLSX SPREADSHEET" when an Excel file is open.
        Under THAT:  the sheet tabs, when the Excel file has more than one sheet.
        (Both hidden for a CSV.  The brain fills them in.)
    -->

    <input type="file" id="csvFileInput" accept=".csv,.xlsx">

    <div id="fileBadge" hidden></div>
    <div id="sheetTabs" role="tablist" aria-label="Sheets" hidden></div>



    <!--
        3.  The search bar

            "disabled"  =  turned OFF.
            It turns ON after you pick a file.
            (Nothing to search yet!)
    -->

    <input type="search" id="searchInput" placeholder="Search text, numbers, or characters..." disabled>



    <!--
        4.  The little words that say where you are

            Like:   "Rows 16–30 of 240"
    -->

    <p id="status">Pick a CSV file to get started.</p>



    <!--
        5.  "Go to row"  +  "Expand"

            "hidden"  =  you can't see it yet.
            It shows up after you pick a file.

            type="number"  ->  the box only takes numbers
    -->

    <div id="controls" hidden>
        <input type="number" id="jumpInput" min="1" placeholder="Row #">
        <button id="jumpBtn">Go to row</button>
        <button id="expandBtn">Expand (show all)</button>
    </div>



    <!--
        6.  THE GLASS WINDOW   (the star of the show)

            It works like a mini Excel sheet:

                "output"  =  the window frame.
                "header"  =  row 0: the column names.  Stuck to the top.
                "rows"    =  all the other rows, under the header.

            It's empty for now.
            The brain fills it in after you pick a file.
    -->

    <div id="output">
        <div id="header"></div>
        <div id="rows"></div>
    </div>



    <!--
        7.  The "Top" button  (bottom-right corner)

            Hidden until you scroll down.
            Click it  ->  back to the top.
    -->

    <button id="topBtn" title="Back to top" hidden>&#8593; Top</button>



    <!--
        8.  THE LOADER   (only shows up for BIG files)

            The screen clouds up, and the pie circle
            fills up all the way around while the brain works.

            role="status" + aria-live  =  screen readers read the words out loud
                                           when they change  ("Cutting it into rows...")
    -->

    <div id="loader" role="status" aria-live="polite" hidden>
        <div id="loaderPie"></div>
        <p id="loaderLabel">Loading...</p>
    </div>



    <!--
        9.  Plug in the brain  (scriptI.js)

            It goes LAST, on purpose.
            The brain needs all the pieces above to exist first,
            so it can find them.

            The Excel translator  (xlsxI.js)  goes right before it,
            because the brain uses it.
    -->

    <script src="xlsxI.js"></script>
    <script src="scriptI.js"></script>



</body>
</html>

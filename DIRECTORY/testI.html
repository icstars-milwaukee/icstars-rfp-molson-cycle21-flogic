<!DOCTYPE html>

<!--
    ==========================================================

        THE NANDO NOTES  -  testI.html

        This file is the SKELETON of the page.
        It says WHAT is on the page.

            testI.html   =  what's there     (skeleton)
            styleI.css   =  how it looks     (clothes)
            scriptI.js   =  what it does     (brain)

    ==========================================================


    The line at the very top  (<!DOCTYPE html>)  MUST stay first.
    It tells the browser:  "this is a normal, modern web page."
-->


<html lang="en">



<!--
    ----------------------------------------------------------

        THE HEAD

        Stuff the browser needs to know.
        You can't SEE any of this on the page.

    ----------------------------------------------------------
-->

<head>

    <!--  Lets the page show any letter or symbol  (é, ñ, ✓, 😀)  -->
    <meta charset="UTF-8">

    <!--  Makes the page fit on phones  -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--  The words on the browser tab  -->
    <title>CSV Reader Test</title>

    <!--  Put on the clothes  (styleI.css)  -->
    <link rel="stylesheet" href="styleI.css">

</head>



<!--
    ----------------------------------------------------------

        THE BODY

        Everything you can SEE on the page.
        It goes top to bottom, in this order.

        Each piece has a name tag:   id="..."
        The brain (scriptI.js) uses the name tag to find it.

    ----------------------------------------------------------
-->

<body>



    <!--
        0.  THE THEME CHIP   (top-left corner)

            A small dark glass rectangle,  in the color of the theme
            you're using right now.  Click it  ->  it UNFOLDS into the theme menu.

            "aria-..."  =  notes for screen readers,
                           so they know it opens a menu.
    -->

    <button id="themeChip" title="Theme: Neo-Neutral" aria-haspopup="true" aria-expanded="false" aria-controls="themeMenu"></button>


    <!--
        The theme menu:  a tiny glass chessboard.
        It sits right on top of the chip, folded down to the chip's size,
        and grows out of it.
        class="folded closed"  =  it starts folded up, and out of sight.

        The brain fills in the list of themes.
    -->

    <div id="themeMenu" class="folded closed" role="menu" aria-label="Themes">
        <p class="menu-title">Theme</p>
        <div id="themeList"></div>
    </div>



    <!--  1.  The big title  -->

    <h1>CSV Reader</h1>



    <!--
        2.  The FILE BAR:   [ Choose File ] [ the aimbot window ]

            The "Choose File" button opens the real file picker  (the input),
            which sits out of sight.

            type="file"          ->  makes it a "pick a file" picker
            accept=".csv,.xlsx"  ->  only shows CSV and Excel files when you pick

            The AIMBOT window  (the snap menu):  search for something,
            and it locks onto a match.  ◀ ▶  snap the sheet right to it.
            The "scope" in the middle shows the 9 cells around the match.
            (The brain fills it all in.)

        Under the bar:   "Reading from...  sales.csv"   (hidden until a file is open)

        Then the badge  ("XLSX SPREADSHEET",  for an Excel file),
        and the sheet tabs  (when the Excel file has more than one sheet).
        (Both hidden for a CSV.  The brain fills them in.)
    -->

    <div id="fileArea">

        <div id="fileBar">
            <button id="chooseBtn" type="button">Choose File</button>
            <input type="file" id="csvFileInput" accept=".csv,.xlsx" tabindex="-1" aria-hidden="true">

            <div id="aimbot" role="group" aria-label="Snap to search matches">
                <div class="aim-head">
                    <span id="aimCount">No search</span>
                    <span id="aimWhere"></span>
                    <button id="aimRowBtn" type="button" aria-expanded="false" aria-controls="aimRow" title="Read the match's full text, and its whole row" disabled>Details ▾</button>
                </div>
                <div class="aim-body">
                    <button id="aimPrev" type="button" aria-label="Previous match" disabled>◀</button>
                    <div id="aimScope" title="Snap to this match"></div>
                    <button id="aimNext" type="button" aria-label="Next match" disabled>▶</button>
                </div>
            </div>
        </div>

        <!--  The DETAILS, when you press "Details ▾".  It drops down right under the bar:
                1.  The match's FULL text,  big and easy to read  (the "focus" card).
                2.  Its whole row:  every column's name and value.
              (The brain fills it in.)  -->
        <div id="aimRow" role="region" aria-label="The match's details" hidden>
            <div class="row-head">
                <span id="aimRowTitle"></span>
                <button id="aimRowClose" type="button" aria-label="Close the details">×</button>
            </div>
            <div id="aimFocus">
                <div id="aimFocusName"></div>
                <div id="aimFocusText"></div>
            </div>
            <p class="row-sub">Viewing row vertically<span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></p>
            <div id="aimRowList"></div>
        </div>

    </div>

    <p id="readingFrom" hidden>Reading from<span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span> <span id="readingName"></span></p>

    <div id="fileBadge" hidden></div>
    <div id="sheetTabs" role="tablist" aria-label="Sheets" hidden></div>



    <!--
        3.  The search bar

            "disabled"  =  turned OFF.
            It turns ON after you pick a file.
            (Nothing to search yet!)
    -->

    <input type="search" id="searchInput" placeholder="Search text, numbers, or characters..." disabled>



    <!--
        4.  The little words that say where you are

            Like:   "Rows 16–30 of 240"
    -->

    <p id="status">Pick a CSV file to get started.</p>



    <!--
        5.  "Drag mode"  +  "Go to row"  +  "Expand"

            "hidden"  =  you can't see it yet.
            It shows up after you pick a file.

            DRAG MODE:  hold on the sheet and drag,  any direction.  Let go  ->  it stops.
            (Like the middle-click scroll on Windows,  for every mouse,  trackpad,  and phone.)
            aria-pressed  =  tells screen readers it's an on/off switch,  and which one it is now.

            type="number"  ->  the box only takes numbers
    -->

    <div id="controls" hidden>
        <button id="dragBtn" type="button" aria-pressed="false" title="Drag mode: hold on the sheet and drag, any direction">Drag mode</button>
        <input type="number" id="jumpInput" min="1" placeholder="Row #">
        <button id="jumpBtn">Go to row</button>
        <button id="expandBtn">Expand (show all)</button>
    </div>



    <!--
        6.  THE GLASS WINDOW   (the star of the show)

            It works like a mini Excel sheet:

                "output"  =  the window frame.
                "header"  =  row 0: the column names.  Stuck to the top.
                "rows"    =  all the other rows, under the header.

            It's empty for now.
            The brain fills it in after you pick a file.
    -->

    <div id="output">
        <div id="header"></div>
        <div id="rows"></div>
    </div>

    <!--  Drag mode's ANCHOR:  a little glass dot where you pressed.  Drag away from it.  -->
    <div id="dragAnchor" hidden></div>



    <!--
        7.  The "Top" button  (bottom-right corner)

            Hidden until you scroll down.
            Click it  ->  back to the top.
    -->

    <button id="topBtn" title="Back to top" hidden>&#8593; Top</button>



    <!--
        8.  THE LOADER   (only shows up for BIG files)

            The screen clouds up, and the pie circle
            fills up all the way around while the brain works.

            role="status" + aria-live  =  screen readers read the words out loud
                                           when they change  ("Cutting it into rows...")
    -->

    <div id="loader" role="status" aria-live="polite" hidden>
        <div id="loaderPie"></div>
        <p id="loaderLabel">Loading...</p>
    </div>



    <!--
        9.  Plug in the brain  (scriptI.js)

            It goes LAST, on purpose.
            The brain needs all the pieces above to exist first,
            so it can find them.

            The Excel translator  (xlsxI.js)  goes right before it,
            because the brain uses it.
    -->

    <script src="xlsxI.js"></script>
    <script src="scriptI.js"></script>



</body>
</html>

# Flogic as a web page:  static files only.   No data,  no keys,  no API,  nothing to log in to on the server.
# A person's files are opened IN THEIR BROWSER and never leave it:  the headers below make the browser enforce that.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Redirects say "/DataPage/..." and nothing else. nginx would otherwise write its own port (8080) into them,
    # which is wrong behind a proxy, on another published port, or on HTTPS in front.
    absolute_redirect off;

    # connect-src 'none':  the page can't send anything anywhere  (no fetch,  no XHR,  no WebSocket,  no beacon).
    # script-src 'self':   only the app's own script files run  (nothing inline,  nothing from another site).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Always ask the server if a file changed:  a new release shows up on the next visit,  not a week later.
    add_header Cache-Control "no-cache" always;

    # The address alone opens the app.
    location = / { return 302 /DataPage/flogic.html; }

    # "Is it alive?"  for Docker's health check and the smoke test.
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location = /favicon.ico { access_log off; log_not_found off; return 204; }

    # Data and key files are never served,  even if one ends up in the folder by mistake.
    location ~* \.(flogic|flogic-key|flogic-keyring|flogic-signer|flogic-id|csv|xlsx|sql|db|zip)$ { return 404; }

    location / { try_files $uri =404; }
}

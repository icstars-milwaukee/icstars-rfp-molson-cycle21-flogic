# The check that runs every time:  on every push and every pull request.
#
#   1. it builds     every script parses, and the Docker image builds
#   2. it is alive   the container answers, and what it serves is OUR app  (deploy/smoke.sh)
#   3. it is right   key files and preset data do what they should, on made-up rows  (preset-core-test.mjs)
#
# And the deploy hangs off the end:  on a release branch or a v* tag, a green run publishes the image.
# Nothing here uses a password or a real file:  CI runs on a machine we don't own.
name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: scripts parse, the numbers are right, no data in the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rung 1 - every script parses
        run: |
          set -euo pipefail
          for f in DataPage/*.js it-console/*.js desktop/titlebar/*.js handoff/tests/*.mjs; do
            node --check "$f"
          done
          echo "Every script parses."

      - name: Rung 3 - key files and preset data are right
        run: node handoff/tests/preset-core-test.mjs

      - name: No data, no keys, a blank trust file
        run: bash deploy/no-data-check.sh

  image:
    name: the image builds, is alive, and is ours
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - name: Rung 1 - the image builds
        run: docker build -t flogic:ci .

      - name: The image holds the app's files and nothing else
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh flogic:ci -c "find /usr/share/nginx/html -type f" | sort > files.txt
          cat files.txt
          if grep -vE '\.(html|js|css|ico|png|svg)$' files.txt; then
            echo "::error::The image holds a file that is not part of the app (listed above)."
            exit 1
          fi
          if grep -q '/it-console/' files.txt; then
            echo "::error::IT's console is in the default image. It goes in only with --build-arg IT_CONSOLE=1."
            exit 1
          fi
          docker run --rm --entrypoint sh flogic:ci -c "grep -q 'const FLOGIC_IT_SIGNER = null;' /usr/share/nginx/html/DataPage/it-signerI.js" \
            || { echo "::error::The image was built with a filled-in trust file."; exit 1; }
          echo "Only app files, no IT console, a blank trust file."

      - name: Rung 2 - it is alive, and it is ours
        run: |
          set -euo pipefail
          docker run -d --name flogic --read-only --tmpfs /tmp --cap-drop ALL -p 8080:8080 flogic:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz > /dev/null 2>&1 && break
            sleep 1
          done
          bash deploy/smoke.sh http://127.0.0.1:8080
          docker logs flogic 2>&1 | tail -5
          docker rm -f flogic

      - name: The same, with IT's console asked for
        run: |
          set -euo pipefail
          docker build -t flogic:ci-it --build-arg IT_CONSOLE=1 .
          docker run -d --name flogic-it --read-only --tmpfs /tmp --cap-drop ALL -p 8081:8080 flogic:ci-it
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8081/healthz > /dev/null 2>&1 && break
            sleep 1
          done
          IT_CONSOLE=1 bash deploy/smoke.sh http://127.0.0.1:8081
          docker rm -f flogic-it

  publish:
    name: publish the image (release branches and v* tags only)
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # release/0.3.0  ->  :0.3.0       v0.3.0  ->  :0.3.0       and always  :sha-<7 letters>
      # (The image name must be lower case.)
      - id: tags
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF#refs/heads/release/}"
          VERSION="${VERSION#refs/tags/v}"
          echo "tags=$IMAGE:$VERSION,$IMAGE:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Where it went
        run: echo "Published ${{ steps.tags.outputs.tags }}"

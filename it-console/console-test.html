<script>
'use strict';

window.__results = [];
window.__done = false;

function check(name, ok, detail) {
    window.__results.push({ name: name, ok: !!ok, detail: ok ? '' : String(detail === undefined ? '' : detail) });
    const li = document.createElement('li');
    li.className = ok ? 'ok' : 'fail';
    li.textContent = (ok ? 'ok   ' : 'FAIL ') + name + (ok || detail === undefined ? '' : '   (' + detail + ')');
    document.getElementById('list').appendChild(li);
}

async function throwsCode(promiseOrFn, code) {
    try { await (typeof promiseOrFn === 'function' ? promiseOrFn() : promiseOrFn); return 'no error'; }
    catch (e) { return e.code === code ? true : 'code ' + e.code + ': ' + e.message; }
}

function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

async function until(fn, ms) {
    const end = Date.now() + (ms || 20000);
    while (Date.now() < end) { if (fn()) return true; await wait(50); }
    return false;
}

async function readText(url) { return (await fetch(url)).text(); }
async function readBytes(url) { return new Uint8Array(await (await fetch(url)).arrayBuffer()); }

function sameBytes(a, b) {
    a = new Uint8Array(a); b = new Uint8Array(b);
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
}

const PASS = 'correct horse battery staple';


// ==========================================================
//    PART A:  THE LOGIC
// ==========================================================

async function testKeyringLogic() {
    check('A weak IT passphrase is refused', await throwsCode(ITConsole.newKeyring('short'), 'weak-passphrase'));

    const s = await ITConsole.newKeyring(PASS);
    check('A new keyring starts empty and unsaved', s.groups.length === 0 && s.people.length === 0 && s.unsaved === true);

    //  An EMPTY keyring still refuses a wrong passphrase  (its check key)
    const empty = await ITConsole.keyringText(s);
    check('An empty keyring: a wrong passphrase is refused', await throwsCode(ITConsole.openKeyring(empty, 'not the right passphrase'), 'wrong-secret'));
    const noCheck = JSON.parse(empty); noCheck.locked.keys = [];
    check('A keyring without its check key: refused as damaged', await throwsCode(ITConsole.openKeyring(JSON.stringify(noCheck), PASS), 'not-a-keyring'));

    //  a group key,  by hand  (step 2 adds the real way)
    s.groups.push({ group: 'service-desk', label: 'Service Desk', keyVersion: 1, rules: { export: true, autoLockMin: 15 } });
    s.keys['service-desk'] = { keyVersion: 1, key: await VaultCore.newGroupKey() };

    const text = await ITConsole.keyringText(s);
    const file = JSON.parse(text);
    check('The keyring file has its shape (v 2: groups, people, packs, signer, locked keys)',
          file.flogic === 'keyring' && file.v === 2 && file.groups.length === 1 && Array.isArray(file.people) &&
          Array.isArray(file.packs) && file.signer === null &&
          file.locked && file.locked.rounds === VaultCore.ROUNDS && file.locked.keys.length === 2, text.slice(0, 200));
    check('The keyring file has no passphrase in it', text.indexOf(PASS) < 0);

    const back = await ITConsole.openKeyring(text, PASS);
    const raw1 = new Uint8Array(await crypto.subtle.exportKey('raw', s.keys['service-desk'].key));
    const raw2 = new Uint8Array(await crypto.subtle.exportKey('raw', back.keys['service-desk'].key));
    check('Saved, then opened with the passphrase: the same key comes back', sameBytes(raw1, raw2) && back.unsaved === false);

    check('Opened with a wrong passphrase: refused', await throwsCode(ITConsole.openKeyring(text, 'not the right passphrase'), 'wrong-secret'));
    check('Not a keyring (a credential): refused', await throwsCode(ITConsole.openKeyring('{"flogic":"credential"}', PASS), 'not-a-keyring'));
    check('Not JSON: refused', await throwsCode(ITConsole.openKeyring('hello', PASS), 'not-a-keyring'));
    const newer = JSON.parse(text); newer.v = 2;
    check('A newer keyring: refused', await throwsCode(ITConsole.openKeyring(JSON.stringify(newer), PASS), 'bad-version'));
    const odd = JSON.parse(text); odd.groups.push({ group: 'change-team', label: 'x', keyVersion: 1, rules: {} });
    check('Groups and keys that don\'t match: refused', await throwsCode(ITConsole.openKeyring(JSON.stringify(odd), PASS), 'not-a-keyring'));
}


async function testGroupLogic() {
    check('Slug: "Service Desk" -> service-desk', ITConsole.slugify('Service Desk') === 'service-desk');
    check('Slug: "  Change  Team!! " -> change-team', ITConsole.slugify('  Change  Team!! ') === 'change-team');
    check('Slug: "Café / Ops #2" -> cafe-ops-2', ITConsole.slugify('Café / Ops #2') === 'cafe-ops-2', ITConsole.slugify('Café / Ops #2'));
    check('Id rule: a-z, 0-9 and dashes only',
          ITConsole.groupIdProblem('service-desk') === '' && ITConsole.groupIdProblem('Service-Desk') !== '' &&
          ITConsole.groupIdProblem('a|b') !== '' && ITConsole.groupIdProblem('a b') !== '' && ITConsole.groupIdProblem('') !== '' &&
          ITConsole.groupIdProblem('-x') !== '' && ITConsole.groupIdProblem('x-') !== '' && ITConsole.groupIdProblem('~check') !== '');
    check('Rules: export yes/no, auto-lock 1–240 whole minutes',
          ITConsole.rulesProblem({ export: true, autoLockMin: 15 }) === '' && ITConsole.rulesProblem({ export: false, autoLockMin: 240 }) === '' &&
          ITConsole.rulesProblem({ export: true, autoLockMin: 0 }) !== '' && ITConsole.rulesProblem({ export: true, autoLockMin: 241 }) !== '' &&
          ITConsole.rulesProblem({ export: true, autoLockMin: 1.5 }) !== '' && ITConsole.rulesProblem({ export: 'yes', autoLockMin: 15 }) !== '');

    const s = await ITConsole.newKeyring(PASS);
    const sd = await ITConsole.addGroup(s, { label: ' Service Desk ', group: 'service-desk', rules: { export: true, autoLockMin: 15 } });
    check('Make a group: the label is trimmed, keyVersion 1, a new key', sd.label === 'Service Desk' && sd.keyVersion === 1 &&
          s.keys['service-desk'] && s.keys['service-desk'].key.algorithm.name === 'AES-GCM' && s.keys['service-desk'].key.extractable === true);
    check('No duplicate ids', await throwsCode(ITConsole.addGroup(s, { label: 'Another', group: 'service-desk', rules: { export: true, autoLockMin: 5 } }), 'bad-group'));
    check('A bad id is refused', await throwsCode(ITConsole.addGroup(s, { label: 'X', group: 'Bad Id', rules: { export: true, autoLockMin: 5 } }), 'bad-group'));
    check('Bad rules are refused', await throwsCode(ITConsole.addGroup(s, { label: 'X', group: 'x', rules: { export: true, autoLockMin: 999 } }), 'bad-group'));
    check('Nothing is added when refused', s.groups.length === 1 && Object.keys(s.keys).length === 1);

    const ct = await ITConsole.addGroup(s, { label: 'Change Team', group: 'change-team', rules: { export: false, autoLockMin: 10 } });
    const rawBefore = new Uint8Array(await crypto.subtle.exportKey('raw', s.keys['change-team'].key));
    ITConsole.editGroup(s, 'change-team', { label: 'Change Team (CAB)', rules: { export: true, autoLockMin: 30 } });
    const rawAfter = new Uint8Array(await crypto.subtle.exportKey('raw', s.keys['change-team'].key));
    check('Edit a group: the label and rules change, the id and key don\'t',
          ct.label === 'Change Team (CAB)' && ct.rules.export === true && ct.rules.autoLockMin === 30 && ct.group === 'change-team' &&
          sameBytes(rawBefore, rawAfter));
    check('Edit: bad rules are refused', (function () {
        try { ITConsole.editGroup(s, 'change-team', { label: 'x', rules: { export: true, autoLockMin: 0 } }); return false; }
        catch (e) { return e.code === 'bad-group' && ct.rules.autoLockMin === 30; }
    })());

    const back = await ITConsole.openKeyring(await ITConsole.keyringText(s), PASS);
    check('Groups survive Save and Open (with their rules and keys)',
          back.groups.length === 2 && back.groups[1].label === 'Change Team (CAB)' && back.groups[1].rules.autoLockMin === 30 &&
          sameBytes(rawAfter, new Uint8Array(await crypto.subtle.exportKey('raw', back.keys['change-team'].key))));

    const bad = JSON.parse(await ITConsole.keyringText(s)); bad.groups[0].rules.autoLockMin = 'lots';
    check('A keyring with a broken group: refused as damaged', await throwsCode(ITConsole.openKeyring(JSON.stringify(bad), PASS), 'not-a-keyring'));
}


async function testPackLogic() {
    const s = await ITConsole.newKeyring(PASS);
    await ITConsole.addGroup(s, { label: 'Service Desk', group: 'service-desk', rules: { export: true, autoLockMin: 15 } });
    await ITConsole.addGroup(s, { label: 'Change Team', group: 'change-team', rules: { export: false, autoLockMin: 10 } });

    const csv = await readBytes('../demo-data/demo_incident.csv');
    check('The demo CSV is there to pack', csv.length > 100000, csv.length);
    const p = await ITConsole.packFile(s, 'demo_incident.csv', csv, 'service-desk', '2026-11-05');
    check('Pack: named demo_incident.flogic', p.name === 'demo_incident.flogic', p.name);
    const h = VaultCore.readPackHeader(p.bytes).header;
    check('Pack: readPackHeader shows the right group (id and label), file name, rows: null and the date',
          h.group === 'service-desk' && h.groupLabel === 'Service Desk' && h.keyVersion === 1 && h.fileName === 'demo_incident.csv' && h.rows === null && h.made === '2026-11-05',
          JSON.stringify(h));
    check('Pack: openPack with the group key gives the exact same bytes',
          sameBytes(await VaultCore.openPack(p.bytes, s.keys['service-desk'].key), csv));
    check('Pack: another group\'s key can\'t open it',
          await throwsCode(VaultCore.openPack(p.bytes, s.keys['change-team'].key), 'locked-out'));
    const text = new TextDecoder().decode(p.bytes);
    check('Pack: the data isn\'t readable in the file', text.indexOf('INC1000000') < 0 && text.indexOf('Short description') < 0);

    check('Pack: today\'s date when none is given', (await ITConsole.packFile(s, 'a.sql', new Uint8Array([1, 2]), 'change-team')).header.made === ITConsole.today());
    check('Pack: .CSV in capitals is fine, .txt and no extension aren\'t',
          ITConsole.packProblem('X.CSV') === '' && ITConsole.packProblem('a.xlsx') === '' && ITConsole.packProblem('notes.txt') !== '' &&
          ITConsole.packProblem('csv') !== '');
    check('Pack: a .txt file is refused', await throwsCode(ITConsole.packFile(s, 'notes.txt', new Uint8Array(3), 'service-desk'), 'bad-pack'));
    check('Pack: an unknown group is refused', await throwsCode(ITConsole.packFile(s, 'a.csv', new Uint8Array(3), 'nobody'), 'bad-pack'));
    check('Pack name: "my.data.v2.xlsx" -> my.data.v2.flogic', ITConsole.packName('my.data.v2.xlsx') === 'my.data.v2.flogic');
}


async function rawKey(key) { return new Uint8Array(await crypto.subtle.exportKey('raw', key)); }

async function testPersonLogic() {
    const s = await ITConsole.newKeyring(PASS);
    await ITConsole.addGroup(s, { label: 'Service Desk', group: 'service-desk', rules: { export: true, autoLockMin: 15 } });
    await ITConsole.addGroup(s, { label: 'Change Team', group: 'change-team', rules: { export: false, autoLockMin: 10 } });

    check('Person id: the first is u-0001', ITConsole.nextPersonId(s) === 'u-0001');
    check('Person id: one more than the biggest', ITConsole.nextPersonId({ people: [{ id: 'u-0001' }, { id: 'u-0007' }, { id: 'x' }] }) === 'u-0008');
    check('Expiry: defaults to Dec 31 of this year', ITConsole.defaultExpiry() === new Date().getFullYear() + '-12-31' &&
          ITConsole.expiryProblem(ITConsole.defaultExpiry()) === '');
    check('Expiry: Feb 30, a past date, and junk are refused',
          ITConsole.expiryProblem(new Date().getFullYear() + 1 + '-02-30') !== '' && ITConsole.expiryProblem('2020-01-01') !== '' &&
          ITConsole.expiryProblem('soon') !== '' && ITConsole.expiryProblem(ITConsole.today()) === '');
    check('File name: first name, small letters', ITConsole.credentialFileName('Fernando G', 'u-0001') === 'fernando.flogic-id' &&
          ITConsole.credentialFileName('DJ', 'u-0002') === 'dj.flogic-id' && ITConsole.credentialFileName('  José María ', 'u-9') === 'jose.flogic-id');
    check('File name: no usable first name -> the id', ITConsole.credentialFileName('李 雷', 'u-0003') === 'u-0003.flogic-id' &&
          ITConsole.credentialFileName('../../etc', 'u-0004') === 'etc.flogic-id');

    const expires = ITConsole.defaultExpiry();
    const made = await ITConsole.makePerson(s, { name: ' Fernando G ', groups: ['service-desk'], expires: expires });
    const fileText = JSON.stringify(made.credential, null, 2);
    const cred = VaultCore.readCredential(fileText);
    check('Credential: the right shape (id, name, groups with rules, expiry)', cred.id === 'u-0001' && cred.name === 'Fernando G' &&
          cred.expires === expires && cred.groups.length === 1 && cred.groups[0].group === 'service-desk' &&
          cred.groups[0].label === 'Service Desk' && cred.groups[0].rules.export === true && cred.groups[0].rules.autoLockMin === 15,
          fileText.slice(0, 300));
    check('Credential: the file is named fernando.flogic-id', made.fileName === 'fernando.flogic-id');
    check('Setup code: 15 symbols, in groups of 5', /^[2-9A-HJKMNP-Z]{5}-[2-9A-HJKMNP-Z]{5}-[2-9A-HJKMNP-Z]{5}$/.test(made.setupCode), made.setupCode);

    const opened = await VaultCore.openCredential(cred, made.setupCode);
    check('openCredential with the setup code gives exactly the person\'s groups',
          opened.length === 1 && opened[0].group === 'service-desk' && opened[0].keyVersion === 1);
    check('...and it\'s the group\'s real key', sameBytes(await rawKey(opened[0].key), await rawKey(s.keys['service-desk'].key)));
    const typed = VaultCore.normalizeCode(made.setupCode).toLowerCase().replace(/(.{3})/g, '$1 ');
    check('The setup code typed in small letters with spaces still opens it', (await VaultCore.openCredential(cred, typed)).length === 1);
    check('A wrong setup code: refused', await throwsCode(VaultCore.openCredential(cred, VaultCore.makeCode(15)), 'wrong-secret'));

    const plain = VaultCore.normalizeCode(made.setupCode);
    check('The setup code isn\'t in the credential file', fileText.indexOf(plain) < 0 && fileText.indexOf(made.setupCode) < 0);
    const ringText = await ITConsole.keyringText(s);
    check('The setup code isn\'t in the keyring', ringText.indexOf(plain) < 0 && ringText.indexOf(made.setupCode) < 0);
    const p = s.people[0];
    check('The keyring remembers the person: id, name, group ids, level, last day, made, reviewed (no keys, no code)',
          s.people.length === 1 && p.id === 'u-0001' && p.name === 'Fernando G' && p.groups.join() === 'service-desk' &&
          p.expires === expires && p.made === ITConsole.today() && p.reviewed === ITConsole.today() && p.level === 'analyst' &&
          Object.keys(p).sort().join() === 'expires,groups,id,level,made,name,reviewed' &&
          s.unsaved === true, JSON.stringify(p));

    const both = await ITConsole.makePerson(s, { name: 'DJ', groups: ['change-team', 'service-desk'], expires: expires });
    const opened2 = await VaultCore.openCredential(both.credential, both.setupCode);
    check('Two groups: both keys, and a new id (u-0002)', both.credential.id === 'u-0002' && opened2.length === 2 &&
          opened2.map(function (k) { return k.group; }).sort().join() === 'change-team,service-desk');
    check('Every credential gets its own setup code', both.setupCode !== made.setupCode);

    check('No groups: refused', await throwsCode(ITConsole.makePerson(s, { name: 'X', groups: [], expires: expires }), 'bad-person'));
    check('A group not in the keyring: refused', await throwsCode(ITConsole.makePerson(s, { name: 'X', groups: ['service-desk', 'nope'], expires: expires }), 'bad-person'));
    check('No name: refused', await throwsCode(ITConsole.makePerson(s, { name: '  ', groups: ['service-desk'], expires: expires }), 'bad-person'));
    check('A past expiry: refused', await throwsCode(ITConsole.makePerson(s, { name: 'X', groups: ['service-desk'], expires: '2020-01-01' }), 'bad-person'));
    check('Nothing is added when refused', s.people.length === 2);

    const back = await ITConsole.openKeyring(await ITConsole.keyringText(s), PASS);
    check('People survive Save and Open, and the next id goes on (u-0003)', back.people.length === 2 && ITConsole.nextPersonId(back) === 'u-0003');
}


function daysAgo(n) {
    const d = new Date(Date.now() - n * 86400000);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

//  The app's trust file  (text)  ->  the pinned key inside it
function pinnedFrom(text) { return new Function(text + '\nreturn FLOGIC_IT_SIGNER;')(); }

async function testAccessLogic() {
    const P = FlogicPolicy, S = SignInCore;
    const s = await ITConsole.newKeyring(PASS);
    await ITConsole.addGroup(s, { label: 'Service Desk', group: 'service-desk', rules: { export: true, autoLockMin: 15 } });
    await ITConsole.addGroup(s, { label: 'Change Team', group: 'change-team', rules: { export: false, autoLockMin: 10 } });

    // ---- people and levels ----
    check('Person: no level is refused', await throwsCode(function () { return ITConsole.addPerson(s, { name: 'X', groups: ['service-desk'], expires: '' }); }, 'bad-person'));
    check('Person: a made-up level is refused', await throwsCode(function () { return ITConsole.addPerson(s, { name: 'X', groups: ['service-desk'], level: 'boss', expires: '' }); }, 'bad-person'));
    check('Person: a Guest in two groups is refused', await throwsCode(function () { return ITConsole.addPerson(s, { name: 'X', groups: ['service-desk', 'change-team'], level: 'guest', expires: '' }); }, 'bad-person'));
    check('Person: a last day in the past is refused', await throwsCode(function () { return ITConsole.addPerson(s, { name: 'X', groups: ['service-desk'], level: 'viewer', expires: '2020-01-01' }); }, 'bad-person'));
    const fern = ITConsole.addPerson(s, { name: ' Fernando G ', groups: ['service-desk'], level: 'analyst', expires: '' });
    check('Person: added with a level, reviewed today, no last day, and no key of any kind',
          fern.id === 'u-0001' && fern.name === 'Fernando G' && fern.level === 'analyst' && fern.reviewed === ITConsole.today() && fern.expires === '' &&
          Object.keys(fern).sort().join() === 'expires,groups,id,level,made,name,reviewed', JSON.stringify(fern));
    const guest = ITConsole.addPerson(s, { name: 'Visitor V', groups: ['service-desk'], level: 'guest', expires: '' });
    const viewer = ITConsole.addPerson(s, { name: 'DJ', groups: ['service-desk', 'change-team'], level: 'viewer', expires: '' });

    // ---- no signing key,  no key file ----
    check('Key file: no signing key yet is said plainly', await throwsCode(ITConsole.makeKeyFile(s, fern.id), 'no-signer'));
    check('Trust file: none without a signing key', await throwsCode(function () { return ITConsole.trustFile(s); }, 'no-signer'));
    const fp = await ITConsole.makeSigner(s);
    const pinned = pinnedFrom(ITConsole.trustFile(s));
    check('Signing key: made inside the keyring, and the trust file carries its public half only',
          /^[2-9A-Z]{4}(-[2-9A-Z]{4}){3}$/.test(fp) && pinned.fingerprint === fp && !('d' in pinned.publicKey) &&
          !/locked|wrapped/.test(ITConsole.trustFile(s)), fp);

    // ---- key files ----
    const made = await ITConsole.makeKeyFile(s, fern.id);
    const c = await S.check(S.readKey(made.text), pinned);
    check('Key file: signed by the keyring\'s key, for the person, at their level', c.sub === 'u-0001' && c.name === 'Fernando G' && c.level === 'analyst' &&
          c.reviewed === ITConsole.today() && c.groups.length === 1 && c.groups[0].group === 'service-desk');
    check('Key file: an Analyst\'s lasts 7 days, not a day more', Math.abs(new Date(c.expires) - new Date(c.issued) - 7 * 86400000) < 5000);
    check('Key file: the app that trusts ANOTHER key refuses it', await throwsCode(S.check(S.readKey(made.text), FLOGIC_IT_SIGNER), 'wrong-issuer'));
    check('Key file: the keyring notes when it ends (and nothing else about it)', fern.key && fern.key.until === c.expires &&
          Object.keys(fern.key).sort().join() === 'made,until' && s.unsaved === true);
    const g = JSON.parse((await ITConsole.makeKeyFile(s, guest.id)).file.claims);
    check('Key file: a Guest\'s lasts 1 day, can\'t export, and locks after 5 minutes',
          Math.abs(new Date(g.expires) - new Date(g.issued) - 86400000) < 5000 && g.groups[0].rules.export === false && g.groups[0].rules.autoLockMin === 5);
    const v = JSON.parse((await ITConsole.makeKeyFile(s, viewer.id)).file.claims);
    check('Key file: a Viewer in both groups can\'t export from either, 10 minutes at most',
          v.groups.length === 2 && v.groups.every(function (x) { return x.rules.export === false && x.rules.autoLockMin === 10; }));
    const ringText = await ITConsole.keyringText(s);
    const rawSd = VaultCore.toB64(await rawKey(s.keys['service-desk'].key));
    check('The saved keyring holds no key file, no plain group key and no passphrase',
          ringText.indexOf(made.file.sig) < 0 && ringText.indexOf(rawSd) < 0 && ringText.indexOf(PASS) < 0 && ringText.indexOf('"claims"') < 0);

    // ---- a last day cuts the key file short ----
    ITConsole.editPerson(s, fern.id, { name: 'Fernando G', groups: ['service-desk'], level: 'analyst', expires: daysAgo(-2) });
    const cut = JSON.parse((await ITConsole.makeKeyFile(s, fern.id)).file.claims);
    check('Last day: the key file ends with it, not 7 days out', new Date(cut.expires) - Date.now() < 3 * 86400000);
    ITConsole.editPerson(s, fern.id, { name: 'Fernando G', groups: ['service-desk'], level: 'analyst', expires: '' });

    // ---- the 30-day review ----
    fern.reviewed = daysAgo(25);
    check('Review: 25 days in, it says a review is coming, and a key file can still be made',
          ITConsole.personState(s, fern).code === 'review-soon' && ITConsole.personState(s, fern).canIssue === true, ITConsole.personState(s, fern).words);
    fern.reviewed = daysAgo(P.REVIEW_EVERY_DAYS + 2);
    check('Review: past 30 days, it\'s overdue and no key file can be made', ITConsole.personState(s, fern).code === 'review-due' &&
          await throwsCode(ITConsole.makeKeyFile(s, fern.id), 'policy') === true);
    fern.reviewed = '';
    check('Review: never reviewed, no key file', ITConsole.personState(s, fern).code === 'unreviewed' && await throwsCode(ITConsole.makeKeyFile(s, fern.id), 'policy') === true);
    ITConsole.reviewPerson(s, fern.id);
    check('Review: "Still needed" marks today, and key files work again', fern.reviewed === ITConsole.today() && !!(await ITConsole.makeKeyFile(s, fern.id)));

    // ---- more access counts as a fresh decision;  less doesn't ----
    viewer.reviewed = daysAgo(20);
    ITConsole.editPerson(s, viewer.id, { name: 'DJ', groups: ['change-team'], level: 'viewer', expires: '' });
    check('Edit: taking a group away doesn\'t count as a review', viewer.reviewed === daysAgo(20) && viewer.groups.join() === 'change-team');
    ITConsole.editPerson(s, viewer.id, { name: 'DJ', groups: ['change-team'], level: 'analyst', expires: '' });
    check('Edit: raising the level does (it\'s a new decision, made today)', viewer.reviewed === ITConsole.today() && viewer.level === 'analyst');
    check('Edit: an Analyst can\'t be made a two-group Guest', await throwsCode(function () {

let W = null;           //  the frame's window
let saved = [];         //  what the page "downloaded":  [{ name, blob  (a promise) }]

function $(id) { return W.document.getElementById(id); }

function type(id, value) {
    const el = $(id);
    el.value = value;
    el.dispatchEvent(new W.Event('input', { bubbles: true }));
    el.dispatchEvent(new W.Event('change', { bubbles: true }));
}

function pick(id, name, content, mime) {
    const dt = new W.DataTransfer();
    dt.items.add(new W.File([content], name, { type: mime || '' }));
    $(id).files = dt.files;
    $(id).dispatchEvent(new W.Event('change', { bubbles: true }));
}

function visible(id) { const el = $(id); return !!el && !el.hidden && el.offsetParent !== null; }

async function loadPage() {
    const frame = document.getElementById('frame');
    await new Promise(function (r) { frame.onload = r; frame.src = 'it-console.html'; });
    W = frame.contentWindow;
    //  Catch the page's downloads where they happen  (<a download>.click()),  and read the Blob
    //  right away,  before the page revokes its URL.
    W.HTMLAnchorElement.prototype.click = function () {
        if (this.download && this.href.indexOf('blob:') === 0) {
            saved.push({ name: this.download, blob: fetch(this.href).then(function (r) { return r.blob(); }) });
        }
    };
}

    check('Page: the row says it\'s in their folder', /in their folder/.test($('status-u-0001').textContent) && !/not in their folder/.test($('status-u-0001').textContent));
    const inFolder = root.__dirs.get('u-0001').__files.get('flogic.flogic-key');
    const c2 = await S.check(S.readKey(inFolder), pinned);
    check('Page: the folder\'s key file is a newer one than the download', new Date(c2.issued) > new Date(c1.issued) && c2.serial !== c1.serial);
    $('make-u-0002').click();
    await until(function () { return /Put Visitor V/.test($('issue-msg').textContent); }, 30000);
    const cg = await S.check(S.readKey(root.__dirs.get('u-0002').__files.get('flogic.flogic-key')), pinned);
    check('Page: the Guest\'s key file, made by name: 1 day, no export', cg.level === 'guest' && cg.groups[0].rules.export === false &&
          Math.abs(new Date(cg.expires) - new Date(cg.issued) - 86400000) < 5000);

    //  End access:  two clicks,  and it says what it can't do
    $('end-u-0001').click();
    check('Page: End access asks first, and says the key file out there can\'t be taken back early', /can't be taken back early/.test($('issue-msg').textContent) &&
          !/ended/.test($('person-u-0001').textContent), $('issue-msg').textContent);
    $('end-u-0001').click();
    check('Page: the second click ends it: no Make key file, no End access button', /Access ended/.test($('person-u-0001').textContent) &&
          $('make-u-0001').disabled && !$('end-u-0001') && $('review-u-0001').textContent === 'Give access back');
    $('review-u-0001').click();
    check('Page: Give access back puts them back, reviewed today', !$('make-u-0001').disabled && !!$('end-u-0001') && /confirmed today/.test($('issue-msg').textContent));

    //  Edit a person
    $('edit-u-0002').click();
    check('Page: Edit fills the form', $('c-name').value === 'Visitor V' && $('pp-level').value === 'guest' && $('c-btn').textContent === 'Save changes' && visible('pp-cancel'));
    $('pp-level').value = 'viewer';
    $('c-groups').querySelectorAll('input').forEach(function (i) { i.checked = true; });
    $('c-btn').click();
    check('Page: the Guest becomes a Viewer in both groups', /Viewer/.test($('person-u-0002').textContent) && /Service Desk, Change Team/.test($('person-u-0002').textContent) &&
          $('c-btn').textContent === 'Add person', $('person-u-0002').textContent);

    //  Save,  Lock,  Open:  it all comes back,  and Lock leaves nothing on the page
    saved = [];
    $('save-btn').click();
    await until(function () { return saved.length === 1; });
    const ringText = await (await saved[0].blob).text();
    check('Page: the saved keyring holds no key file and no passphrase', ringText.indexOf('"claims"') < 0 && ringText.indexOf(c2.serial) < 0 && ringText.indexOf(PASS) < 0);
    $('lock-btn').click();
    check('Page: Lock takes the people, the to-do list and the signing key\'s name off the page', !isOpen() && $('person-list').children.length === 0 &&
          $('todo').children.length === 0 && $('data-list').children.length === 0 && $('signer-print').textContent === '');
    pick('open-file', 'it.flogic-keyring', ringText, 'application/json');
    type('open-pass', PASS);
    $('open-btn').click();
    await until(isOpen);
    check('Page: opened again: the same signing key, levels, and key file dates', $('signer-print').textContent === fp &&
          /Analyst/.test($('person-u-0001').textContent) && /Viewer/.test($('person-u-0002').textContent) && /key file good until/.test($('status-u-0001').textContent));
    $('lock-btn').click();

    //  An older keyring  (no signing key,  no levels)
    const old = JSON.parse(ringText);
    old.v = 1; delete old.signer; delete old.packs;
    old.people = old.people.map(function (p) { return { id: p.id, name: p.name, groups: p.groups, expires: '2099-12-31', made: p.made }; });
    pick('open-file', 'old.flogic-keyring', JSON.stringify(old), 'application/json');
    type('open-pass', PASS);
    $('open-btn').click();
    await until(isOpen);
    check('Page: an older keyring opens, says what changed, and can\'t make key files yet', /older console/.test($('todo').textContent) &&
          /no signing key yet/.test($('todo').textContent) && visible('signer-none') && $('make-u-0001').disabled && /Not reviewed yet/.test($('person-u-0001').textContent),
          $('todo').textContent);
    $('signer-make').click();
    await until(function () { return visible('signer-has'); }, 30000);
    $('review-u-0001').click();
    check('Page: Make a signing key, then "Still needed": now a key file can be made', visible('signer-has') && !$('make-u-0001').disabled && visible('unsaved'));
    $('lock-btn').click(); $('lock-btn').click();
}


// ==========================================================
//    PART C:  THE DEMO SET   (demo-data/packs/),  opened with the codes in its README
// ==========================================================

async function testDemoSet() {
    const dir = '../demo-data/packs/';
    const readme = await readText(dir + 'README.md');
    check('Demo README: says DEMO ONLY, made-up data, at the top', /^# .*DEMO ONLY, made-up data/.test(readme));
    const pass = /\| `demo-it\.flogic-keyring` \| `([^`]+)` \|/.exec(readme);
    function codeFor(file) {
        const m = new RegExp('\\| `' + file.replace('.', '\\.') + '` \\|[^\\n]*\\| `([^`]+)` \\|').exec(readme);
        return m && m[1];
    }
    check('Demo README: has the IT passphrase and both setup codes', !!pass && !!codeFor('fernando.flogic-id') && !!codeFor('dj.flogic-id'));

    const ring = await ITConsole.openKeyring(await readText(dir + 'demo-it.flogic-keyring'), pass[1]);
    const sd = ring.groups.find(function (g) { return g.group === 'service-desk'; });
    const ct = ring.groups.find(function (g) { return g.group === 'change-team'; });
    check('Demo keyring: opens with the README passphrase', ring.groups.length === 2);
    check('Demo keyring: Service Desk, export yes, 15 min', sd && sd.label === 'Service Desk' && sd.rules.export === true && sd.rules.autoLockMin === 15);
    check('Demo keyring: Change Team, export NO, 10 min', ct && ct.label === 'Change Team' && ct.rules.export === false && ct.rules.autoLockMin === 10);
    check('Demo keyring: lists Fernando G (Service Desk) and DJ (Change Team)', ring.people.length === 2 &&
          ring.people.some(function (p) { return p.name === 'Fernando G' && p.groups.join() === 'service-desk'; }) &&
          ring.people.some(function (p) { return p.name === 'DJ' && p.groups.join() === 'change-team'; }));
    check('Demo keyring: refuses a wrong passphrase', await throwsCode(ITConsole.openKeyring(await readText(dir + 'demo-it.flogic-keyring'), 'nope nope nope nope'), 'wrong-secret'));

    const people = [
        { file: 'fernando.flogic-id', name: 'Fernando G', group: 'service-desk', mine: 'demo_incident', other: 'demo_change_request', otherGroup: 'change-team' },
        { file: 'dj.flogic-id', name: 'DJ', group: 'change-team', mine: 'demo_change_request', other: 'demo_incident', otherGroup: 'service-desk' },
    ];
    for (const p of people) {
        const credText = await readText(dir + p.file);
        const cred = VaultCore.readCredential(credText);
        const code = codeFor(p.file);
        const keys = await VaultCore.openCredential(cred, code);
        check('Demo ' + p.file + ': ' + p.name + ', opens with its README code, to ' + p.group + ' only',
              cred.name === p.name && keys.length === 1 && keys[0].group === p.group && cred.groups[0].group === p.group);
        check('Demo ' + p.file + ': the code isn\'t in the file', credText.indexOf(VaultCore.normalizeCode(code)) < 0);
        check('Demo ' + p.file + ': the same key as the keyring\'s', sameBytes(await rawKey(keys[0].key), await rawKey(ring.keys[p.group].key)));

        const pack = await readBytes(dir + p.mine + '.flogic');
        const csv = await readBytes('../demo-data/' + p.mine + '.csv');
        const h = VaultCore.readPackHeader(pack).header;
        check('Demo ' + p.mine + '.flogic: the label says ' + p.group + ', ' + p.mine + '.csv, rows: null',
              h.group === p.group && h.groupLabel === ring.groups.find(function (g) { return g.group === p.group; }).label &&
              h.fileName === p.mine + '.csv' && h.rows === null && h.keyVersion === 1 && /^\d{4}-\d{2}-\d{2}$/.test(h.made), JSON.stringify(h));
        check('Demo ' + p.mine + '.flogic: ' + p.name + '\'s key opens it to the exact CSV bytes', sameBytes(await VaultCore.openPack(pack, keys[0].key), csv));
        check('Demo ' + p.other + '.flogic: ' + p.name + '\'s key can\'t open it (it\'s for ' + p.otherGroup + ')',
              VaultCore.readPackHeader(await readBytes(dir + p.other + '.flogic')).header.group === p.otherGroup &&
              await throwsCode(VaultCore.openPack(await readBytes(dir + p.other + '.flogic'), keys[0].key), 'locked-out') === true);
    }

    //  And the page opens the demo keyring too
    await loadPage();
    pick('open-file', 'demo-it.flogic-keyring', await readText(dir + 'demo-it.flogic-keyring'));
    type('open-pass', pass[1]);
    $('open-btn').click();
    await until(isOpen);
    check('Page: opens the demo keyring (2 groups, 2 people)', isOpen() && $('group-list').children.length === 2 &&
          $('person-list').children.length === 2 && /2 groups · 2 people/.test($('keyring-counts').textContent));
    check('Page: the demo keyring signs with the key the app trusts', $('signer-print').textContent === FLOGIC_IT_SIGNER.fingerprint &&
          /trusts this key/.test($('signer-trust').textContent), $('signer-print').textContent + ' / ' + $('signer-trust').textContent);
    check('Page: Fernando G is an Analyst, DJ a Viewer', /Analyst/.test($('person-u-0001').textContent) && /Viewer/.test($('person-u-0002').textContent));
    check('Page: both demo packs are listed under their groups', /Service Desk[\s\S]*demo_incident\.flogic/.test($('data-list').textContent) &&
          /Change Team[\s\S]*demo_change_request\.flogic/.test($('data-list').textContent));
    $('lock-btn').click();
}


// ==========================================================
//    LAST:  THE RULES FOR THIS PAGE
// ==========================================================

async function testRules() {
    let src = await readText('itconsoleI.js');
    src = src.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*$/gm, '');       //  the code,  without its comments
    check('No fetch / XMLHttpRequest in itconsoleI.js', !/\bfetch\s*\(|XMLHttpRequest|WebSocket|sendBeacon/.test(src));
    check('No IndexedDB / localStorage / sessionStorage in itconsoleI.js', !/indexedDB|localStorage|sessionStorage/.test(src));
    check('No innerHTML in itconsoleI.js', !/innerHTML|outerHTML|insertAdjacentHTML|document\.write/.test(src));

    const html = await readText('it-console.html');
    const outside = html.match(/(src|href)\s*=\s*"(https?:)?\/\/[^"]*"/g);
    check('it-console.html loads nothing from the internet', !outside, outside);

    //  The one thing the console may keep:  WHICH FOLDER was connected  (database "flogic-mailbox":  a browser handle,  nothing else).
    const dbs = indexedDB.databases ? await indexedDB.databases() : [];
    const others = dbs.filter(function (d) { return d.name !== 'flogic-mailbox'; });
    check('Nothing in localStorage or sessionStorage afterward, and no database but the folder memory',
          others.length === 0 && localStorage.length === 0 && W.localStorage.length === 0 && W.sessionStorage.length === 0,
          dbs.map(function (d) { return d.name; }).join() + ' / ' + localStorage.length + ' localStorage');
    const kept = await new Promise(function (r) {
        const q = indexedDB.open('flogic-mailbox', 1);
        q.onupgradeneeded = function () { q.result.createObjectStore('folder'); };
        q.onsuccess = function () {
            const t = q.result.transaction('folder', 'readonly').objectStore('folder').getAll();
            t.onsuccess = function () { q.result.close(); r(t.result); };
        };
        q.onerror = function () { r(['?']); };
    });
    check('The folder memory holds no key, no passphrase and no name', !/passphrase|wrapped|"raw"|Fernando|correct horse/i.test(JSON.stringify(kept)), JSON.stringify(kept).slice(0, 200));
}


(async function run() {
    const parts = [testKeyringLogic, testGroupLogic, testPackLogic, testPersonLogic, testAccessLogic,
                   testKeyringPage, testGroupPage, testPackPage, testPersonPage, testKeyFilePage, testDemoSet, testRules];
    for (const part of parts) {
        try { await part(); }
        catch (e) { check(part.name + ' finished', false, e.stack || e.message || e); }
    }
    const passed = window.__results.filter(function (r) { return r.ok; }).length;
    document.getElementById('summary').textContent = passed + ' / ' + window.__results.length + ' passed';
    window.__done = true;
})();
</script>

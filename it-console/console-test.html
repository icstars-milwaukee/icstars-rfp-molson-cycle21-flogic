<body>
<!--
    The IT console's tests.   Headless:   node it-console/run-console-test.mjs
    (or open this page in Chrome started with  --allow-file-access-from-files,  and watch).

    Part A calls  ITConsole  directly  (the logic).
    Part B drives the real page,  it-console.html,  in the frame below:  typing,  clicking,  picking files.
-->
<h1>IT console: tests</h1>
<p id="summary">Running…</p>
<ol id="list"></ol>
<iframe id="frame" title="the console under test"></iframe>

<script src="../DIRECTORY/vaultcoreI.js"></script>
<script src="itconsoleI.js"></script>
<script>
'use strict';

window.__results = [];
window.__done = false;

function check(name, ok, detail) {
    window.__results.push({ name: name, ok: !!ok, detail: ok ? '' : String(detail === undefined ? '' : detail) });
    const li = document.createElement('li');
    li.className = ok ? 'ok' : 'fail';
    li.textContent = (ok ? 'ok   ' : 'FAIL ') + name + (ok || detail === undefined ? '' : '   (' + detail + ')');
    document.getElementById('list').appendChild(li);
}

async function throwsCode(promiseOrFn, code) {
    try { await (typeof promiseOrFn === 'function' ? promiseOrFn() : promiseOrFn); return 'no error'; }
    catch (e) { return e.code === code ? true : 'code ' + e.code + ': ' + e.message; }
}

function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

async function until(fn, ms) {
    const end = Date.now() + (ms || 20000);
    while (Date.now() < end) { if (fn()) return true; await wait(50); }
    return false;
}

async function readText(url) { return (await fetch(url)).text(); }
async function readBytes(url) { return new Uint8Array(await (await fetch(url)).arrayBuffer()); }

function sameBytes(a, b) {
    a = new Uint8Array(a); b = new Uint8Array(b);
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
}

const PASS = 'correct horse battery staple';


// ==========================================================
//    PART A:  THE LOGIC
// ==========================================================

async function testKeyringLogic() {
    check('A weak IT passphrase is refused', await throwsCode(ITConsole.newKeyring('short'), 'weak-passphrase'));

    const s = await ITConsole.newKeyring(PASS);
    check('A new keyring starts empty and unsaved', s.groups.length === 0 && s.people.length === 0 && s.unsaved === true);

    //  An EMPTY keyring still refuses a wrong passphrase  (its check key)
    const empty = await ITConsole.keyringText(s);
    check('An empty keyring: a wrong passphrase is refused', await throwsCode(ITConsole.openKeyring(empty, 'not the right passphrase'), 'wrong-secret'));
    const noCheck = JSON.parse(empty); noCheck.locked.keys = [];
    check('A keyring without its check key: refused as damaged', await throwsCode(ITConsole.openKeyring(JSON.stringify(noCheck), PASS), 'not-a-keyring'));

    //  a group key,  by hand  (step 2 adds the real way)
    s.groups.push({ group: 'service-desk', label: 'Service Desk', keyVersion: 1, rules: { export: true, autoLockMin: 15 } });
    s.keys['service-desk'] = { keyVersion: 1, key: await VaultCore.newGroupKey() };

    const text = await ITConsole.keyringText(s);
    const file = JSON.parse(text);
    check('The keyring file has the F1 shape',
          file.flogic === 'keyring' && file.v === 1 && file.groups.length === 1 && Array.isArray(file.people) &&
          file.locked && file.locked.rounds === VaultCore.ROUNDS && file.locked.keys.length === 2, text.slice(0, 200));
    check('The keyring file has no passphrase in it', text.indexOf(PASS) < 0);

    const back = await ITConsole.openKeyring(text, PASS);
    const raw1 = new Uint8Array(await crypto.subtle.exportKey('raw', s.keys['service-desk'].key));
    const raw2 = new Uint8Array(await crypto.subtle.exportKey('raw', back.keys['service-desk'].key));
    check('Saved, then opened with the passphrase: the same key comes back', sameBytes(raw1, raw2) && back.unsaved === false);

    check('Opened with a wrong passphrase: refused', await throwsCode(ITConsole.openKeyring(text, 'not the right passphrase'), 'wrong-secret'));
    check('Not a keyring (a credential): refused', await throwsCode(ITConsole.openKeyring('{"flogic":"credential"}', PASS), 'not-a-keyring'));
    check('Not JSON: refused', await throwsCode(ITConsole.openKeyring('hello', PASS), 'not-a-keyring'));
    const newer = JSON.parse(text); newer.v = 2;
    check('A newer keyring: refused', await throwsCode(ITConsole.openKeyring(JSON.stringify(newer), PASS), 'bad-version'));
    const odd = JSON.parse(text); odd.groups.push({ group: 'change-team', label: 'x', keyVersion: 1, rules: {} });
    check('Groups and keys that don\'t match: refused', await throwsCode(ITConsole.openKeyring(JSON.stringify(odd), PASS), 'not-a-keyring'));
}


async function testGroupLogic() {
    check('Slug: "Service Desk" -> service-desk', ITConsole.slugify('Service Desk') === 'service-desk');
    check('Slug: "  Change  Team!! " -> change-team', ITConsole.slugify('  Change  Team!! ') === 'change-team');
    check('Slug: "Café / Ops #2" -> cafe-ops-2', ITConsole.slugify('Café / Ops #2') === 'cafe-ops-2', ITConsole.slugify('Café / Ops #2'));
    check('Id rule: a-z, 0-9 and dashes only',
          ITConsole.groupIdProblem('service-desk') === '' && ITConsole.groupIdProblem('Service-Desk') !== '' &&
          ITConsole.groupIdProblem('a|b') !== '' && ITConsole.groupIdProblem('a b') !== '' && ITConsole.groupIdProblem('') !== '' &&
          ITConsole.groupIdProblem('-x') !== '' && ITConsole.groupIdProblem('x-') !== '' && ITConsole.groupIdProblem('~check') !== '');
    check('Rules: export yes/no, auto-lock 1–240 whole minutes',
          ITConsole.rulesProblem({ export: true, autoLockMin: 15 }) === '' && ITConsole.rulesProblem({ export: false, autoLockMin: 240 }) === '' &&
          ITConsole.rulesProblem({ export: true, autoLockMin: 0 }) !== '' && ITConsole.rulesProblem({ export: true, autoLockMin: 241 }) !== '' &&
          ITConsole.rulesProblem({ export: true, autoLockMin: 1.5 }) !== '' && ITConsole.rulesProblem({ export: 'yes', autoLockMin: 15 }) !== '');

    const s = await ITConsole.newKeyring(PASS);
    const sd = await ITConsole.addGroup(s, { label: ' Service Desk ', group: 'service-desk', rules: { export: true, autoLockMin: 15 } });
    check('Make a group: the label is trimmed, keyVersion 1, a new key', sd.label === 'Service Desk' && sd.keyVersion === 1 &&
          s.keys['service-desk'] && s.keys['service-desk'].key.algorithm.name === 'AES-GCM' && s.keys['service-desk'].key.extractable === true);
    check('No duplicate ids', await throwsCode(ITConsole.addGroup(s, { label: 'Another', group: 'service-desk', rules: { export: true, autoLockMin: 5 } }), 'bad-group'));
    check('A bad id is refused', await throwsCode(ITConsole.addGroup(s, { label: 'X', group: 'Bad Id', rules: { export: true, autoLockMin: 5 } }), 'bad-group'));
    check('Bad rules are refused', await throwsCode(ITConsole.addGroup(s, { label: 'X', group: 'x', rules: { export: true, autoLockMin: 999 } }), 'bad-group'));
    check('Nothing is added when refused', s.groups.length === 1 && Object.keys(s.keys).length === 1);

    const ct = await ITConsole.addGroup(s, { label: 'Change Team', group: 'change-team', rules: { export: false, autoLockMin: 10 } });
    const rawBefore = new Uint8Array(await crypto.subtle.exportKey('raw', s.keys['change-team'].key));
    ITConsole.editGroup(s, 'change-team', { label: 'Change Team (CAB)', rules: { export: true, autoLockMin: 30 } });
    const rawAfter = new Uint8Array(await crypto.subtle.exportKey('raw', s.keys['change-team'].key));
    check('Edit a group: the label and rules change, the id and key don\'t',
          ct.label === 'Change Team (CAB)' && ct.rules.export === true && ct.rules.autoLockMin === 30 && ct.group === 'change-team' &&
          sameBytes(rawBefore, rawAfter));
    check('Edit: bad rules are refused', (function () {
        try { ITConsole.editGroup(s, 'change-team', { label: 'x', rules: { export: true, autoLockMin: 0 } }); return false; }
        catch (e) { return e.code === 'bad-group' && ct.rules.autoLockMin === 30; }
    })());

    const back = await ITConsole.openKeyring(await ITConsole.keyringText(s), PASS);
    check('Groups survive Save and Open (with their rules and keys)',
          back.groups.length === 2 && back.groups[1].label === 'Change Team (CAB)' && back.groups[1].rules.autoLockMin === 30 &&
          sameBytes(rawAfter, new Uint8Array(await crypto.subtle.exportKey('raw', back.keys['change-team'].key))));

    const bad = JSON.parse(await ITConsole.keyringText(s)); bad.groups[0].rules.autoLockMin = 'lots';
    check('A keyring with a broken group: refused as damaged', await throwsCode(ITConsole.openKeyring(JSON.stringify(bad), PASS), 'not-a-keyring'));
}


async function testPackLogic() {
    const s = await ITConsole.newKeyring(PASS);
    await ITConsole.addGroup(s, { label: 'Service Desk', group: 'service-desk', rules: { export: true, autoLockMin: 15 } });
    await ITConsole.addGroup(s, { label: 'Change Team', group: 'change-team', rules: { export: false, autoLockMin: 10 } });

    const csv = await readBytes('../demo-data/demo_incident.csv');
    check('The demo CSV is there to pack', csv.length > 100000, csv.length);
    const p = await ITConsole.packFile(s, 'demo_incident.csv', csv, 'service-desk', '2026-11-05');
    check('Pack: named demo_incident.flogic', p.name === 'demo_incident.flogic', p.name);
    const h = VaultCore.readPackHeader(p.bytes).header;
    check('Pack: readPackHeader shows the right group (id and label), file name, rows: null and the date',
          h.group === 'service-desk' && h.groupLabel === 'Service Desk' && h.keyVersion === 1 && h.fileName === 'demo_incident.csv' && h.rows === null && h.made === '2026-11-05',
          JSON.stringify(h));
    check('Pack: openPack with the group key gives the exact same bytes',
          sameBytes(await VaultCore.openPack(p.bytes, s.keys['service-desk'].key), csv));
    check('Pack: another group\'s key can\'t open it',
          await throwsCode(VaultCore.openPack(p.bytes, s.keys['change-team'].key), 'locked-out'));
    const text = new TextDecoder().decode(p.bytes);
    check('Pack: the data isn\'t readable in the file', text.indexOf('INC1000000') < 0 && text.indexOf('Short description') < 0);

    check('Pack: today\'s date when none is given', (await ITConsole.packFile(s, 'a.sql', new Uint8Array([1, 2]), 'change-team')).header.made === ITConsole.today());
    check('Pack: .CSV in capitals is fine, .txt and no extension aren\'t',
          ITConsole.packProblem('X.CSV') === '' && ITConsole.packProblem('a.xlsx') === '' && ITConsole.packProblem('notes.txt') !== '' &&
          ITConsole.packProblem('csv') !== '');
    check('Pack: a .txt file is refused', await throwsCode(ITConsole.packFile(s, 'notes.txt', new Uint8Array(3), 'service-desk'), 'bad-pack'));
    check('Pack: an unknown group is refused', await throwsCode(ITConsole.packFile(s, 'a.csv', new Uint8Array(3), 'nobody'), 'bad-pack'));
    check('Pack name: "my.data.v2.xlsx" -> my.data.v2.flogic', ITConsole.packName('my.data.v2.xlsx') === 'my.data.v2.flogic');
}


async function rawKey(key) { return new Uint8Array(await crypto.subtle.exportKey('raw', key)); }

async function testPersonLogic() {
    const s = await ITConsole.newKeyring(PASS);
    await ITConsole.addGroup(s, { label: 'Service Desk', group: 'service-desk', rules: { export: true, autoLockMin: 15 } });
    await ITConsole.addGroup(s, { label: 'Change Team', group: 'change-team', rules: { export: false, autoLockMin: 10 } });

    check('Person id: the first is u-0001', ITConsole.nextPersonId(s) === 'u-0001');
    check('Person id: one more than the biggest', ITConsole.nextPersonId({ people: [{ id: 'u-0001' }, { id: 'u-0007' }, { id: 'x' }] }) === 'u-0008');
    check('Expiry: defaults to Dec 31 of this year', ITConsole.defaultExpiry() === new Date().getFullYear() + '-12-31' &&
          ITConsole.expiryProblem(ITConsole.defaultExpiry()) === '');
    check('Expiry: Feb 30, a past date, and junk are refused',
          ITConsole.expiryProblem(new Date().getFullYear() + 1 + '-02-30') !== '' && ITConsole.expiryProblem('2020-01-01') !== '' &&
          ITConsole.expiryProblem('soon') !== '' && ITConsole.expiryProblem(ITConsole.today()) === '');
    check('File name: first name, small letters', ITConsole.credentialFileName('Fernando G', 'u-0001') === 'fernando.flogic-id' &&
          ITConsole.credentialFileName('DJ', 'u-0002') === 'dj.flogic-id' && ITConsole.credentialFileName('  José María ', 'u-9') === 'jose.flogic-id');
    check('File name: no usable first name -> the id', ITConsole.credentialFileName('李 雷', 'u-0003') === 'u-0003.flogic-id' &&
          ITConsole.credentialFileName('../../etc', 'u-0004') === 'etc.flogic-id');

    const expires = ITConsole.defaultExpiry();
    const made = await ITConsole.makePerson(s, { name: ' Fernando G ', groups: ['service-desk'], expires: expires });
    const fileText = JSON.stringify(made.credential, null, 2);
    const cred = VaultCore.readCredential(fileText);
    check('Credential: the right shape (id, name, groups with rules, expiry)', cred.id === 'u-0001' && cred.name === 'Fernando G' &&
          cred.expires === expires && cred.groups.length === 1 && cred.groups[0].group === 'service-desk' &&
          cred.groups[0].label === 'Service Desk' && cred.groups[0].rules.export === true && cred.groups[0].rules.autoLockMin === 15,
          fileText.slice(0, 300));
    check('Credential: the file is named fernando.flogic-id', made.fileName === 'fernando.flogic-id');
    check('Setup code: 15 symbols, in groups of 5', /^[2-9A-HJKMNP-Z]{5}-[2-9A-HJKMNP-Z]{5}-[2-9A-HJKMNP-Z]{5}$/.test(made.setupCode), made.setupCode);

    const opened = await VaultCore.openCredential(cred, made.setupCode);
    check('openCredential with the setup code gives exactly the person\'s groups',
          opened.length === 1 && opened[0].group === 'service-desk' && opened[0].keyVersion === 1);
    check('...and it\'s the group\'s real key', sameBytes(await rawKey(opened[0].key), await rawKey(s.keys['service-desk'].key)));
    const typed = VaultCore.normalizeCode(made.setupCode).toLowerCase().replace(/(.{3})/g, '$1 ');
    check('The setup code typed in small letters with spaces still opens it', (await VaultCore.openCredential(cred, typed)).length === 1);
    check('A wrong setup code: refused', await throwsCode(VaultCore.openCredential(cred, VaultCore.makeCode(15)), 'wrong-secret'));

    const plain = VaultCore.normalizeCode(made.setupCode);
    check('The setup code isn\'t in the credential file', fileText.indexOf(plain) < 0 && fileText.indexOf(made.setupCode) < 0);
    const ringText = await ITConsole.keyringText(s);
    check('The setup code isn\'t in the keyring', ringText.indexOf(plain) < 0 && ringText.indexOf(made.setupCode) < 0);
    const p = s.people[0];
    check('The keyring remembers the person: id, name, group ids, expiry, made (no keys, no code)',
          s.people.length === 1 && p.id === 'u-0001' && p.name === 'Fernando G' && p.groups.join() === 'service-desk' &&
          p.expires === expires && p.made === ITConsole.today() && Object.keys(p).sort().join() === 'expires,groups,id,made,name' &&
          s.unsaved === true, JSON.stringify(p));

    const both = await ITConsole.makePerson(s, { name: 'DJ', groups: ['change-team', 'service-desk'], expires: expires });
    const opened2 = await VaultCore.openCredential(both.credential, both.setupCode);
    check('Two groups: both keys, and a new id (u-0002)', both.credential.id === 'u-0002' && opened2.length === 2 &&
          opened2.map(function (k) { return k.group; }).sort().join() === 'change-team,service-desk');
    check('Every credential gets its own setup code', both.setupCode !== made.setupCode);

    check('No groups: refused', await throwsCode(ITConsole.makePerson(s, { name: 'X', groups: [], expires: expires }), 'bad-person'));
    check('A group not in the keyring: refused', await throwsCode(ITConsole.makePerson(s, { name: 'X', groups: ['service-desk', 'nope'], expires: expires }), 'bad-person'));
    check('No name: refused', await throwsCode(ITConsole.makePerson(s, { name: '  ', groups: ['service-desk'], expires: expires }), 'bad-person'));
    check('A past expiry: refused', await throwsCode(ITConsole.makePerson(s, { name: 'X', groups: ['service-desk'], expires: '2020-01-01' }), 'bad-person'));
    check('Nothing is added when refused', s.people.length === 2);

    const back = await ITConsole.openKeyring(await ITConsole.keyringText(s), PASS);
    check('People survive Save and Open, and the next id goes on (u-0003)', back.people.length === 2 && ITConsole.nextPersonId(back) === 'u-0003');
}


// ==========================================================
//    PART B:  THE PAGE
// ==========================================================

let W = null;           //  the frame's window
let saved = [];         //  what the page "downloaded":  [{ name, blob  (a promise) }]

function $(id) { return W.document.getElementById(id); }

function type(id, value) {
    const el = $(id);
    el.value = value;
    el.dispatchEvent(new W.Event('input', { bubbles: true }));
    el.dispatchEvent(new W.Event('change', { bubbles: true }));
}

function pick(id, name, content, mime) {
    const dt = new W.DataTransfer();
    dt.items.add(new W.File([content], name, { type: mime || '' }));
    $(id).files = dt.files;
    $(id).dispatchEvent(new W.Event('change', { bubbles: true }));
}

function visible(id) { const el = $(id); return !!el && !el.hidden && el.offsetParent !== null; }

async function loadPage() {
    const frame = document.getElementById('frame');
    await new Promise(function (r) { frame.onload = r; frame.src = 'it-console.html'; });
    W = frame.contentWindow;
    //  Catch the page's downloads where they happen  (<a download>.click()),  and read the Blob
    //  right away,  before the page revokes its URL.
    W.HTMLAnchorElement.prototype.click = function () {
        if (this.download && this.href.indexOf('blob:') === 0) {
            saved.push({ name: this.download, blob: fetch(this.href).then(function (r) { return r.blob(); }) });
        }
    };
}

function isOpen() { return visible('main') && !visible('start'); }

async function testKeyringPage() {
    await loadPage();
    check('The page starts on the first screen', visible('start') && !visible('main'));

    //  New keyring:  a weak passphrase,  then two that don't match,  then a good one
    type('new-pass', 'short'); type('new-pass2', 'short');
    $('new-btn').click();
    check('Page: its scripts run (the CSP lets them in), and a weak passphrase is refused',
          /12 characters/.test($('start-msg').textContent) && !visible('main'), $('start-msg').textContent);
    type('new-pass', PASS); type('new-pass2', PASS + 'x');
    $('new-btn').click();
    check('Page: passphrases that don\'t match are refused', /don.t match/.test($('start-msg').textContent) && !visible('main'));
    type('new-pass2', PASS);
    $('new-btn').click();
    await until(function () { return visible('main'); });
    check('Page: New keyring opens it, marked unsaved', visible('main') && visible('unsaved'));

    //  Save
    saved = [];
    $('save-btn').click();
    await until(function () { return saved.length === 1; });
    check('Page: Save keyring downloads it, and the unsaved mark goes', saved.length === 1 && !visible('unsaved') &&
          /\.flogic-keyring$/.test(saved[0] && saved[0].name), saved[0] && saved[0].name);
    const keyringFile = saved[0] ? await (await saved[0].blob).text() : '';
    check('Page: the saved file opens with the passphrase', (await ITConsole.openKeyring(keyringFile, PASS)).groups.length === 0);

    //  Lock  (saved:  no warning)
    $('lock-btn').click();
    check('Page: Lock goes back to the first screen and forgets the keyring', !isOpen() && /Locked/.test($('start-msg').textContent));

    //  Lock with unsaved changes warns first   (a new keyring is unsaved)
    type('new-pass', PASS); type('new-pass2', PASS);
    $('new-btn').click();
    await until(isOpen);
    $('lock-btn').click();
    check('Page: Lock with unsaved changes warns first', isOpen() && /unsaved changes/.test($('keyring-msg').textContent));
    $('lock-btn').click();
    check('Page: ...and the second click locks', !isOpen());

    //  Open with a wrong passphrase,  then the right one
    pick('open-file', 'it.flogic-keyring', keyringFile, 'application/json');
    type('open-pass', 'wrong wrong wrong wrong');
    $('open-btn').click();
    await until(function () { return /doesn.t open/.test($('start-msg').textContent); });
    check('Page: a wrong passphrase says so, and shows nothing', /doesn.t open/.test($('start-msg').textContent) && !isOpen(),
          $('start-msg').textContent + ' / open: ' + isOpen());

    type('open-pass', PASS);
    $('open-btn').click();
    await until(function () { return visible('main'); });
    check('Page: the right passphrase opens it, saved (no unsaved mark)', visible('main') && !visible('unsaved'));
    check('Page: the passphrase box is emptied after opening', $('open-pass').value === '', $('open-pass').value);
    $('lock-btn').click();
}


//  Opens a fresh,  empty keyring in the page.
async function newPageKeyring() {
    if (isOpen()) { $('lock-btn').click(); if (isOpen()) $('lock-btn').click(); }
    type('new-pass', PASS); type('new-pass2', PASS);
    $('new-btn').click();
    await until(isOpen);
}

async function testGroupPage() {
    await newPageKeyring();
    check('Page: a new keyring shows "No groups yet"', visible('group-none') && $('group-list').children.length === 0);

    type('g-label', 'Service Desk');
    check('Page: the id fills in from the name', $('g-id').value === 'service-desk', $('g-id').value);
    check('Page: export starts at Yes (DJ\'s call), auto-lock at 15', $('g-export').checked === true && $('g-autolock').value === '15');
    $('g-add').click();
    await until(function () { return $('group-list').children.length === 1; });
    const row = $('group-list').children[0];
    check('Page: Make group adds a row (name, id, export, auto-lock)', row && /Service Desk/.test(row.textContent) &&
          /service-desk/.test(row.textContent) && /Yes/.test(row.textContent) && /15 min/.test(row.textContent), row && row.textContent);
    check('Page: ...and the form empties', $('g-label').value === '' && $('g-id').value === '');

    type('g-label', 'Service Desk');
    $('g-add').click();
    await until(function () { return /already/.test($('group-msg').textContent); });
    check('Page: a duplicate id is refused', /already/.test($('group-msg').textContent) && $('group-list').children.length === 1);

    check('Page: export is back at Yes for the next group', $('g-export').checked === true);
    type('g-label', 'Change Team');
    type('g-id', 'Change Team');
    $('g-add').click();
    check('Page: a hand-typed bad id is refused', /small letters/.test($('group-msg').textContent) && $('group-list').children.length === 1,
          $('group-msg').textContent);
    type('g-id', '');
    type('g-label', '<img src=x onerror="parent.__xss=1">');
    $('g-add').click();
    await until(function () { return $('group-list').children.length === 2; });
    check('Page: a name with HTML in it shows as text, not as HTML',
          !$('group-list').querySelector('img') && /<img/.test($('group-list').textContent) && !window.__xss);

    //  Edit the first one
    $('group-list').querySelector('button[data-group="service-desk"]').click();
    check('Page: Edit fills the form and locks the id', $('g-label').value === 'Service Desk' && $('g-id').disabled && $('g-export').checked &&
          visible('g-edit-note'));
    type('g-label', 'Service Desk L1');
    type('g-autolock', '300');
    $('g-add').click();
    check('Page: Edit refuses auto-lock over 240', /1 to 240/.test($('group-msg').textContent), $('group-msg').textContent);
    type('g-autolock', '20');
    $('g-add').click();
    const row1 = $('group-list').children[0];
    check('Page: Edit changes the name and rules, and keeps the id', /Service Desk L1/.test(row1.textContent) &&
          /service-desk/.test(row1.textContent) && /20 min/.test(row1.textContent) && !$('g-id').disabled && visible('unsaved'));

    //  Save,  Lock,  Open:  the groups are back
    saved = [];
    $('save-btn').click();
    await until(function () { return saved.length === 1; });
    const text = await (await saved[0].blob).text();
    $('lock-btn').click();
    pick('open-file', 'it.flogic-keyring', text);
    type('open-pass', PASS);
    $('open-btn').click();
    await until(isOpen);
    check('Page: the groups come back after Save, Lock and Open', $('group-list').children.length === 2 &&
          /Service Desk L1/.test($('group-list').textContent));
    $('lock-btn').click();
    check('Page: Lock empties the groups list (not just hides it)', !isOpen() && $('group-list').children.length === 0 &&
          $('g-label').value === '');
}


async function testPackPage() {
    await newPageKeyring();
    check('Page: Pack is off until there\'s a group', $('p-btn').disabled && $('p-group').disabled);
    type('g-label', 'Service Desk'); $('g-export').checked = true; $('g-add').click();
    await until(function () { return $('group-list').children.length === 1; });
    type('g-label', 'Change Team'); $('g-add').click();
    await until(function () { return $('group-list').children.length === 2; });
    check('Page: the Pack group list has both groups', $('p-group').options.length === 2 && !$('p-btn').disabled);

    saved = [];
    $('save-btn').click();
    await until(function () { return saved.length === 1; });
    const ring = await ITConsole.openKeyring(await (await saved[0].blob).text(), PASS);

    $('p-btn').click();
    check('Page: Pack with no file says so', /Pick a data file/.test($('pack-msg').textContent));
    pick('p-file', 'notes.txt', 'hello');
    $('p-btn').click();
    check('Page: Pack refuses a .txt file', /Only \.csv/.test($('pack-msg').textContent));

    const csv = await readBytes('../demo-data/demo_change_request.csv');
    pick('p-file', 'demo_change_request.csv', csv, 'text/csv');
    $('p-group').value = 'change-team';
    saved = [];
    $('p-btn').click();
    await until(function () { return saved.length === 1; });
    check('Page: Pack downloads demo_change_request.flogic', saved[0] && saved[0].name === 'demo_change_request.flogic', saved[0] && saved[0].name);
    const pack = new Uint8Array(await (await saved[0].blob).arrayBuffer());
    check('Page: the pack is for Change Team, and opens to the same bytes',
          VaultCore.readPackHeader(pack).header.group === 'change-team' && VaultCore.readPackHeader(pack).header.groupLabel === 'Change Team' &&
          sameBytes(await VaultCore.openPack(pack, ring.keys['change-team'].key), csv));
    check('Page: it shows the size before and after', /\(\d+(\.\d)? (KB|MB)\) into demo_change_request\.flogic \(\d+(\.\d)? (KB|MB)\) for Change Team/
          .test($('pack-msg').textContent), $('pack-msg').textContent);
    check('Page: packing doesn\'t mark the keyring unsaved', !visible('unsaved'));
    $('lock-btn').click();
    check('Page: Lock empties the Pack form', $('p-group').options.length === 0 && $('p-file').files.length === 0 && $('pack-msg').textContent === '');
}


async function testPersonPage() {
    await newPageKeyring();
    check('Page: Make credential is off until there\'s a group', $('c-btn').disabled && visible('person-none'));
    check('Page: expiry starts at Dec 31 of this year', $('c-expires').value === new Date().getFullYear() + '-12-31', $('c-expires').value);
    type('g-label', 'Service Desk'); $('g-add').click();
    await until(function () { return $('group-list').children.length === 1; });
    type('g-label', 'Change Team'); $('g-export').checked = false; $('g-add').click();
    await until(function () { return $('group-list').children.length === 2; });
    check('Page: one checkbox per group', $('c-groups').querySelectorAll('input[type=checkbox]').length === 2 && !$('c-btn').disabled);

    type('c-name', 'Fernando G');
    $('c-btn').click();
    await until(function () { return /at least one group/.test($('person-msg').textContent); });
    check('Page: no group ticked: refused', /at least one group/.test($('person-msg').textContent) && !visible('code-panel'));

    $('c-groups').querySelector('input[value="service-desk"]').checked = true;
    saved = [];
    $('c-btn').click();
    await until(function () { return visible('code-panel'); });
    const code = $('setup-code').textContent;
    check('Page: the setup code shows, big, in groups of 5', visible('code-panel') && /^[2-9A-Z]{5}-[2-9A-Z]{5}-[2-9A-Z]{5}$/.test(code) &&
          parseFloat(W.getComputedStyle($('setup-code')).fontSize) >= 24, code);
    check('Page: with the warning about how to hand it over', /never in the same email as the file/.test($('code-panel').textContent) &&
          /one-time/.test($('code-panel').textContent));
    check('Page: it downloads fernando.flogic-id', saved.length === 1 && saved[0].name === 'fernando.flogic-id', saved[0] && saved[0].name);
    const credText = await (await saved[0].blob).text();
    const cred = VaultCore.readCredential(credText);
    const keys = await VaultCore.openCredential(cred, code);
    check('Page: the downloaded file opens with the shown code, to Service Desk only', keys.length === 1 && keys[0].group === 'service-desk');
    check('Page: the code isn\'t in the downloaded file', credText.indexOf(VaultCore.normalizeCode(code)) < 0 && credText.indexOf(code) < 0);
    check('Page: the person is listed, and the keyring is unsaved', $('person-list').children.length === 1 &&
          /u-0001/.test($('person-list').textContent) && /Fernando G/.test($('person-list').textContent) &&
          /Service Desk/.test($('person-list').textContent) && visible('unsaved'));
    check('Page: the form empties for the next person', $('c-name').value === '' &&
          $('c-groups').querySelectorAll('input:checked').length === 0);

    $('copy-btn').click();
    await until(function () { return $('copy-msg').textContent !== ''; });
    check('Page: Copy says it copied (or selected it)', /Copied|Selected/.test($('copy-msg').textContent), $('copy-msg').textContent);

    saved = [];
    $('save-btn').click();
    await until(function () { return saved.length === 1; });
    const ringText = await (await saved[0].blob).text();
    check('Page: the code isn\'t in the saved keyring', ringText.indexOf(VaultCore.normalizeCode(code)) < 0 && /Fernando G/.test(ringText));

    $('code-done').click();
    check('Page: "Hide it" takes the code off the page', !visible('code-panel') && $('setup-code').textContent === '');

    //  Show one more code,  then Lock:  it goes
    type('c-name', 'DJ');
    $('c-groups').querySelector('input[value="change-team"]').checked = true;
    saved = [];
    $('c-btn').click();
    await until(function () { return visible('code-panel'); });
    check('Page: DJ gets u-0002 and dj.flogic-id', saved[0] && saved[0].name === 'dj.flogic-id' && /u-0002/.test($('person-list').textContent));
    $('lock-btn').click(); $('lock-btn').click();
    check('Page: Lock takes the code and the people off the page', !isOpen() && $('setup-code').textContent === '' &&
          $('person-list').children.length === 0 && $('c-groups').children.length === 0);
}

//    LAST:  THE RULES FOR THIS PAGE
// ==========================================================

async function testRules() {
    let src = await readText('itconsoleI.js');
    src = src.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*$/gm, '');       //  the code,  without its comments
    check('No fetch / XMLHttpRequest in itconsoleI.js', !/\bfetch\s*\(|XMLHttpRequest|WebSocket|sendBeacon/.test(src));
    check('No IndexedDB / localStorage / sessionStorage in itconsoleI.js', !/indexedDB|localStorage|sessionStorage/.test(src));
    check('No innerHTML in itconsoleI.js', !/innerHTML|outerHTML|insertAdjacentHTML|document\.write/.test(src));

    const html = await readText('it-console.html');
    const outside = html.match(/(src|href)\s*=\s*"(https?:)?\/\/[^"]*"/g);
    check('it-console.html loads nothing from the internet', !outside, outside);

    const dbs = indexedDB.databases ? await indexedDB.databases() : [];
    check('Nothing in IndexedDB or localStorage afterward', dbs.length === 0 && localStorage.length === 0 && W.localStorage.length === 0,
          dbs.length + ' databases, ' + localStorage.length + ' localStorage');
}


(async function run() {
    const parts = [testKeyringLogic, testGroupLogic, testPackLogic, testPersonLogic,
                   testKeyringPage, testGroupPage, testPackPage, testPersonPage, testRules];
    for (const part of parts) {
        try { await part(); }
        catch (e) { check(part.name + ' finished', false, e.stack || e.message || e); }
    }
    const passed = window.__results.filter(function (r) { return r.ok; }).length;
    document.getElementById('summary').textContent = passed + ' / ' + window.__results.length + ' passed';
    window.__done = true;
})();
</script>
